    document.getElementById('tagChipRow').addEventListener('click', (e) => {
      const b = e.target.closest('[data-remove-tag]'); if(!b) return;
      checkpoint();
      note.tags = (note.tags||[]).filter(t => t !== b.dataset.removeTag);
      note.updatedAt = Date.now();
      commitMutation(); renderPage(note);
    });

    if(mode === 'draw'){
      setupCanvas(note);
      document.getElementById('cvUndoBtn').addEventListener('click', doUndo);
      document.getElementById('cvRedoBtn').addEventListener('click', doRedo);

      const penBtn = document.getElementById('penBtn');
      const colorPopover = document.getElementById('colorPopover');
      const bgBtn = document.getElementById('bgBtn');
      const bgPopover = document.getElementById('bgPopover');
      const eraserPopover = document.getElementById('eraserPopover');

      // Tapping the tool you're already on toggles its settings popover;
      // tapping a different one switches to it (and brings up its settings),
      // restoring that tool's own remembered colour and thickness.
      function selectTool(t){
        const popOpen = t === 'lasso' ? drawState.lassoPopoverOpen : drawState.colorPopoverOpen;
        const wasOpen = popOpen && !drawState.erasing && drawState.tool === t;
        if(!drawState.erasing && drawState.tool !== 'lasso') saveToolState();
        if(drawState.tool === 'lasso' && t !== 'lasso' && canvasApi) canvasApi.dropSelection();
        drawState.tool = t;
        if(t !== 'lasso') loadToolState();
        drawState.erasing = false;
        drawState.colorPopoverOpen = t !== 'lasso' && !wasOpen;
        drawState.lassoPopoverOpen = t === 'lasso' && !wasOpen;
        drawState.bgPopoverOpen = false;
        drawState.eraserPopoverOpen = false;
        renderPage(note);
      }
      penBtn.addEventListener('click', (e) => { e.stopPropagation(); selectTool('pen'); });
      document.getElementById('pencilBtn').addEventListener('click', (e) => { e.stopPropagation(); selectTool('pencil'); });
      document.getElementById('lassoBtn').addEventListener('click', (e) => { e.stopPropagation(); selectTool('lasso'); });
      document.getElementById('markerBtn').addEventListener('click', (e) => { e.stopPropagation(); selectTool('marker'); });
      document.getElementById('highlighterBtn').addEventListener('click', (e) => { e.stopPropagation(); selectTool('highlighter'); });

      mainEl.querySelectorAll('[data-color]').forEach(s => s.addEventListener('click', (e) => {
        e.stopPropagation();
        drawState.color = s.dataset.color; drawState.erasing = false; saveToolState();
        drawState.colorPopoverOpen = false;
        renderPage(note);
      }));
      const customColorInput = document.getElementById('customColorInput');
      customColorInput.addEventListener('input', (e) => {
        drawState.color = e.target.value; drawState.erasing = false; saveToolState();
        const dot = document.getElementById('penPreviewDot');
        if(dot) dot.style.background = drawState.color;
      });
      customColorInput.addEventListener('change', () => { drawState.colorPopoverOpen = false; renderPage(note); });

      // Colour wheel: hue around, saturation outwards, lightness on the
      // slider — pick anywhere and the live pen preview follows immediately.
      const wheel = document.getElementById('colorWheel');
      const lightSlider = document.getElementById('wheelLightSlider');
      if(wheel && lightSlider){
        const paint = () => drawColorWheel(wheel, drawState.wheelLight / 100);
        paint();
        const applyFromWheel = (ev) => {
          const hex = wheelColorAt(wheel, ev.clientX, ev.clientY, drawState.wheelLight / 100);
          drawState.color = hex; drawState.erasing = false; saveToolState();
          const dot = document.getElementById('penPreviewDot');
          if(dot) dot.style.background = hex;
          const chip = document.getElementById('wheelChip');
          const hexLabel = document.getElementById('wheelHex');
          if(chip) chip.style.background = hex;
          if(hexLabel) hexLabel.textContent = hex;
          const custom = document.getElementById('customColorInput');
          if(custom) custom.value = hex;
        };
        let wheelDragging = false;
        wheel.addEventListener('pointerdown', (ev) => {
          ev.stopPropagation(); ev.preventDefault();
          wheelDragging = true;
          try { wheel.setPointerCapture(ev.pointerId); } catch(err) {}
          applyFromWheel(ev);
        });
        wheel.addEventListener('pointermove', (ev) => { if(wheelDragging) applyFromWheel(ev); });
        ['pointerup','pointercancel','pointerleave'].forEach(evt => wheel.addEventListener(evt, () => { wheelDragging = false; }));
        lightSlider.addEventListener('click', (ev) => ev.stopPropagation());
        lightSlider.addEventListener('input', (ev) => {
          ev.stopPropagation();
          drawState.wheelLight = parseInt(ev.target.value, 10);
          paint();
        });
      }

      const penSizeSlider = document.getElementById('penSizeSlider');
      if(penSizeSlider){
        penSizeSlider.addEventListener('input', (e) => {
          e.stopPropagation();
          drawState.penSize = parseFloat(e.target.value);
          saveToolState();
          const dot = document.getElementById('penPreviewDot');
          const label = document.getElementById('penSizeLabel');
          if(dot){ dot.style.width = drawState.penSize + 'px'; dot.style.height = drawState.penSize + 'px'; }
          if(label) label.textContent = String(drawState.penSize);
        });
        penSizeSlider.addEventListener('click', (e) => e.stopPropagation());
      }

      // Advanced per-tool sliders: stability / tip / sensitivity / concentration.
      mainEl.querySelectorAll('.ts-range[data-setting]').forEach(input => {
        input.addEventListener('click', (e) => e.stopPropagation());
        input.addEventListener('input', (e) => {
          e.stopPropagation();
          const key = input.dataset.setting;
          const val = parseInt(e.target.value, 10);
          patchTool({ [key]: val });
          const out = document.getElementById(key + 'Val');
          if(out) out.textContent = key === 'stability' ? String(val) : val + '%';
          if(key === 'concentration'){
            const dot = document.getElementById('penPreviewDot');
            if(dot) dot.style.opacity = String(val / 100);
          }
        });
      });

      const stepThickness = (dir) => {
        const cfg = toolCfg();
        const next = Math.min(cfg.max, Math.max(cfg.min, +(drawState.penSize + dir * cfg.step).toFixed(2)));
        drawState.penSize = next; saveToolState(); renderPage(note);
      };
      document.getElementById('thickMinus')?.addEventListener('click', (e) => { e.stopPropagation(); stepThickness(-1); });
      document.getElementById('thickPlus')?.addEventListener('click', (e) => { e.stopPropagation(); stepThickness(1); });

      document.getElementById('toolAdvancedBtn')?.addEventListener('click', (e) => {
        e.stopPropagation(); drawState.advancedOpen = !drawState.advancedOpen; renderPage(note);
      });
      document.getElementById('toolResetBtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        const d = toolSettingsDefaults(drawState.tool);
        drawState.tools[drawState.tool] = Object.assign(d, { color: drawState.color });
        drawState.penSize = d.size;
        renderPage(note);
      });
      document.getElementById('straightLineToggle')?.addEventListener('click', (e) => {
        e.stopPropagation(); patchTool({ straightLine: !tset().straightLine }); renderPage(note);
      });
      mainEl.querySelectorAll('#dashSeg [data-dash]').forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation(); patchTool({ dash: b.dataset.dash }); renderPage(note);
      }));
      mainEl.querySelectorAll('#lassoSeg [data-lasso]').forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation(); drawState.lasso.mode = b.dataset.lasso; renderPage(note);
      }));
      document.getElementById('lassoDeleteBtn')?.addEventListener('click', (e) => {
        e.stopPropagation(); if(canvasApi) canvasApi.deleteSelection();
      });
      document.getElementById('lassoPopover')?.addEventListener('click', (e) => e.stopPropagation());
      if(colorPopover) colorPopover.addEventListener('click', (e) => e.stopPropagation());

      document.getElementById('eraserBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = drawState.eraserPopoverOpen && drawState.erasing;
        if(!drawState.erasing) saveToolState();
        drawState.erasing = true;
        drawState.eraserPopoverOpen = !wasOpen;
        drawState.colorPopoverOpen = false; drawState.bgPopoverOpen = false;
        renderPage(note);
      });

      const eraserSizeSlider = document.getElementById('eraserSizeSlider');
      if(eraserSizeSlider){
        eraserSizeSlider.addEventListener('input', (e) => {
          e.stopPropagation();
          drawState.eraserSize = parseInt(e.target.value, 10);
          const dot = document.getElementById('eraserPreviewDot');
          const label = document.getElementById('eraserSizeLabel');
          if(dot){ dot.style.width = drawState.eraserSize + 'px'; dot.style.height = drawState.eraserSize + 'px'; }
          if(label) label.textContent = drawState.eraserSize + 'px';
          updateEraserCursorSize();
        });
        eraserSizeSlider.addEventListener('click', (e) => e.stopPropagation());
      }
      if(eraserPopover) eraserPopover.addEventListener('click', (e) => e.stopPropagation());

      document.getElementById('panBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        drawState.fingerDraw = !drawState.fingerDraw;
        drawState.colorPopoverOpen = false; drawState.bgPopoverOpen = false; drawState.eraserPopoverOpen = false; drawState.lassoPopoverOpen = false;
        renderPage(note);
      });

      bgBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        drawState.paperSnapshot = JSON.stringify(getPaper(note));
        drawState.paperModalOpen = true;
        drawState.colorPopoverOpen = false;
        drawState.eraserPopoverOpen = false;
        renderPage(note);
      });

      // ----- Template sheet -----
      function updatePaper(patch){
        const before = getPaper(note);
        const next = { ...before, ...patch };
        if(patch.paperColor && isDarkPaper(before.paperColor) !== isDarkPaper(patch.paperColor)){
          const nowDark = isDarkPaper(patch.paperColor);
          if(drawState.color === '#ffffff' && !nowDark) drawState.color = '#000000';
          else if(drawState.color === '#000000' && nowDark) drawState.color = '#ffffff';
        }
        note.paper = next;
        note.canvasBg = isDarkPaper(next.paperColor) ? 'dark-dot' : 'grid';
        note.updatedAt = Date.now();
        commitMutation();
        renderPage(note);
      }
      const tplOverlay = document.getElementById('tplOverlay');
      if(tplOverlay){
        const closeTpl = () => { drawState.paperModalOpen = false; renderPage(note); };
        tplOverlay.addEventListener('click', (e) => { if(e.target === tplOverlay) closeTpl(); });
        document.getElementById('tplDone').addEventListener('click', closeTpl);
        document.getElementById('tplCancel').addEventListener('click', () => {
          if(drawState.paperSnapshot){ note.paper = JSON.parse(drawState.paperSnapshot); note.canvasBg = isDarkPaper(note.paper.paperColor) ? 'dark-dot' : 'grid'; commitMutation(); }
          closeTpl();
        });
        mainEl.querySelectorAll('[data-tpl]').forEach(el => el.addEventListener('click', () => updatePaper({ template: el.dataset.tpl })));
        mainEl.querySelectorAll('[data-papercolor]').forEach(el => el.addEventListener('click', () => updatePaper({ paperColor: el.dataset.papercolor })));
        mainEl.querySelectorAll('[data-linecolor]').forEach(el => el.addEventListener('click', () => updatePaper({ lineColor: el.dataset.linecolor })));
        document.getElementById('tplPaperCustom').addEventListener('change', (e) => updatePaper({ paperColor: e.target.value }));
        document.getElementById('tplLineCustom').addEventListener('change', (e) => updatePaper({ lineColor: e.target.value }));
        document.getElementById('tplDirection').addEventListener('change', (e) => updatePaper({ direction: e.target.value }));
        document.getElementById('tplSize').addEventListener('change', (e) => updatePaper({ size: e.target.value }));
        const sp = document.getElementById('tplSpacing');
        sp.addEventListener('input', (e) => {
          document.getElementById('tplSpacingVal').textContent = e.target.value;
          const wrap = document.getElementById('canvasWrapEl');
          if(wrap) wrap.setAttribute('style', paperStyle({ ...getPaper(note), spacing: +e.target.value }));
        });
        sp.addEventListener('change', (e) => updatePaper({ spacing: +e.target.value }));
      }

      document.getElementById('clearCanvasBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        const hasBg = (note.bgPages || []).length > 0;
        if(!confirm(hasBg ? 'Clear your drawing? The imported page(s) underneath will stay.' : 'Clear this drawing?')) return;
        checkpoint();
        note.drawing = null;
        if(hasBg){
          const wrapEl = document.getElementById('canvasWrapEl');
          const cssW = wrapEl ? wrapEl.clientWidth : 0;
          const bgH = note.bgPages.reduce((sum, p) => sum + (p.naturalH / p.naturalW) * cssW, 0);
          note.canvasHeight = Math.max(DEFAULT_CANVAS_HEIGHT, bgH);
        } else {
          note.canvasHeight = DEFAULT_CANVAS_HEIGHT;
        }
        note.updatedAt = Date.now(); commitMutation(); renderPage(note);
      });
    } else if(!previewMode){
      const bodyInput = document.getElementById('bodyInput');
      bodyInput.addEventListener('focus', () => { checkpoint(); setTimeout(() => bodyInput.scrollIntoView({block:'center', behavior:'smooth'}), 300); });
      bodyInput.addEventListener('input', (e) => { note.body = e.target.value; note.updatedAt = Date.now(); commitMutation(); renderSidebar(); });
    }
  }

  // ---------- export ----------
  function exportNote(note, kind){
    const safeTitle = (note.title || 'untitled').replace(/[^a-z0-9\-_ ]/gi,'').trim().replace(/\s+/g,'-').toLowerCase() || 'untitled';
    if(kind === 'md' || kind === 'txt'){
      const content = kind === 'md' ? `# ${note.title || 'Untitled'}\n\n${note.body || ''}` : `${note.title || 'Untitled'}\n\n${note.body || ''}`;
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      saveOrShareFile(blob, `${safeTitle}.${kind}`, 'text/plain');
    } else if(kind === 'png'){
      compositeDrawingPng(note).then(blob => {
        if(blob) saveOrShareFile(blob, `${safeTitle}.png`, 'image/png');
      });
    } else if(kind === 'pdf'){
      const printArea = document.getElementById('printArea');
      const bodyHtml = note.mode === 'draw' && note.drawing
        ? `<img src="${note.drawing}" style="max-width:100%;" />`
        : `<div style="white-space:pre-wrap; line-height:1.6;">${escapeHtml(note.body || '')}</div>`;
      printArea.innerHTML = `<h1 style="font-family:Georgia,serif;">${note.icon||''} ${escapeHtml(note.title || 'Untitled')}</h1>${bodyHtml}`;
      window.print();
    }
  }

  // Flattens a drawing note into a single PNG: any imported background
  // reference pages (a past paper, etc.) first, then the ink on top —
  // matching exactly what's on screen, since those live on separate layers
  // while editing (see importFileAsBackground) so erasing/clearing ink
  // never touches the imported reference material.
  function compositeDrawingPng(note){
    return new Promise((resolve) => {
      const w = 1000; // export at a fixed reference width; height follows content
      const bgPages = note.bgPages || [];
      const bgH = bgPages.reduce((sum, p) => sum + (p.naturalH / p.naturalW) * w, 0);
      const h = Math.max(note.canvasHeight || DEFAULT_CANVAS_HEIGHT, bgH, 1);
      const out = document.createElement('canvas');
      out.width = w; out.height = h;
      const octx = out.getContext('2d');
      const bgStyle = getPaper(note).paperColor;
      octx.fillStyle = bgStyle;
      octx.fillRect(0, 0, w, h);

      function loadImg(src){
        return new Promise((res) => {
          const img = new Image();
          img.onload = () => res(img);
          img.onerror = () => res(null);
          img.src = src;
        });
      }

      (async () => {
        let y = 0;
        for(const page of bgPages){
          const img = await loadImg(page.src);
          const pageH = (page.naturalH / page.naturalW) * w;
          if(img) octx.drawImage(img, 0, y, w, pageH);
          y += pageH;
        }
        if(note.drawing){
          const inkImg = await loadImg(note.drawing);
          if(inkImg) octx.drawImage(inkImg, 0, 0, w, h);
        }
        out.toBlob((blob) => resolve(blob), 'image/png');
      })();
    });
  }

  // ---------- new note / folder ----------
  function createNote(folderId){
    checkpoint();
    const note = {
      id: uid(), title: '', body: '', mode: 'text', drawing: null, canvasBg: 'grid', paper: { template:'grid', paperColor:'#ffffff', lineColor:'#9aa0a6', spacing:5, direction:'Vertical', size:'A4' }, canvasHeight: DEFAULT_CANVAS_HEIGHT,
      icon: ICON_CYCLE[0], tags: [], folderId: folderId || null,
      pinned: false, trashed: false, trashedAt: null,
      createdAt: Date.now(), updatedAt: Date.now(),
    };
    notes.unshift(note);
    activeId = note.id; mobileShowingMain = true; previewMode = false; folderPickerOpen = false;
    commitMutation(); renderAll();
    setTimeout(() => document.getElementById('titleInput')?.focus(), 30);

    const input = document.getElementById('newFolderInput');

    folders.push({ id: uid('f_'), name, color }); input.value = '';

      drawState.colorPopoverOpen = false; drawState.bgPopoverOpen = false; drawState.eraserPopoverOpen = false; drawState.lassoPopoverOpen = false;
      // Close the popovers by touching only their own class — NOT by
      // re-rendering the page. renderPage() rebuilds the canvas elements from
      // the saved PNG, which throws away all live canvas state: most visibly a
      // lifted lasso selection (its ink is already erased from the page, so

      ['colorPopover','bgPopover','eraserPopover','lassoPopover'].forEach(id => {

  });

  window.addEventListener('keydown', (e) => {
    const tagName = (e.target.tagName || '').toLowerCase();
    const inField = tagName === 'input' || tagName === 'textarea';
    const mod = e.ctrlKey || e.metaKey;
    if(!mod) return;
    const key = e.key.toLowerCase();
    if(key === 'n'){ e.preventDefault(); createNote(nav==='folder'?activeFolderId:null); }
    else if(key === 'f'){ e.preventDefault(); searchInputEl.focus(); }
    else if(key === 'z' && !inField){ e.preventDefault(); if(e.shiftKey) doRedo(); else doUndo(); }
    else if(key === 'y' && !inField){ e.preventDefault(); doRedo(); }
    else if(key === 'backspace' && activeId && activeId !== '__trash__'){
      e.preventDefault();
      const note = notes.find(n => n.id === activeId);
      if(note && !note.trashed){
        checkpoint(); note.trashed = true; note.trashedAt = Date.now(); note.pinned = false;

  // Register the service worker so the app shell (this page) is cached and
  // works fully offline once loaded — the notes themselves are already
  // safe locally in IndexedDB, so this just means the *app* also opens
  // instantly with no connection, the way a real installed app does.
  //
  // On top of that: real apps auto-update because an app store actively
  // checks for and installs new versions for you — a website doesn't get
  // that for free, so this replicates it by hand:
  //  1. Actively ask for an update check on every launch (not just wait for
  //     the browser's own occasional check).
  //  2. Keep checking every few minutes while the app stays open, in case
  //     someone leaves it running for a long session.
  //  3. When a new version actually takes over, reload automatically if
  //     nothing looks like it's actively being written/drawn right now —
  //     so most of the time it just quietly updates itself between uses,
  //     exactly like a native app would. If it can't tell for sure, it
  //     shows a small "Refresh" banner instead of yanking the page out
  //     from under an in-progress stroke or sentence.
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        reg.update().catch(() => {});
        setInterval(() => reg.update().catch(() => {}), 5 * 60 * 1000);
      }).catch(() => {});
    });

    let hadController = !!navigator.serviceWorker.controller;
    let refreshing = false;
    const updateBanner = document.getElementById('updateBanner');
    const updateBannerBtn = document.getElementById('updateBannerBtn');

    function looksIdle(){
      // A drawing note has focus on the canvas itself (not a text field),
      // so also treat "actively drawing" as active by checking whether a
      // pointer is currently down isn't tracked globally — the simplest
      // reliable signal available here is keyboard focus on a text field,
      // plus whether the tab/app is even in the foreground at all.
      if(document.visibilityState === 'hidden') return true;
      const ae = document.activeElement;
      const isTypingSomewhere = ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT' || ae.isContentEditable);
      return !isTypingSomewhere;
    }

    function applyUpdateNow(){
      if(refreshing) return;
      refreshing = true;
      window.location.reload();
    }

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(!hadController){ hadController = true; return; } // first-ever activation, not an "update"
      if(looksIdle()){
        applyUpdateNow();
      } else if(updateBanner){
        updateBanner.classList.add('show');
      }
    });

    if(updateBannerBtn) updateBannerBtn.addEventListener('click', applyUpdateNow);

    // If the banner was shown because something looked active, still catch
    // the moment it becomes safe to update on its own (app backgrounded,
    // or focus leaves whatever field was being edited).
    document.addEventListener('visibilitychange', () => {
      if(updateBanner && updateBanner.classList.contains('show') && looksIdle()) applyUpdateNow();
    });
  }
})();
</script>

</body>
</html>
