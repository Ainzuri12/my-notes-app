<style>
  :root{
    --bg: #0a0a0b;
    --sidebar-bg: #131316;
    --panel: #1b1b1f;
    --card: #1c1c20;
    --card-hover: #232327;
    --border: #2a2a2e;
    --text: #f1f1f2;
    --text-secondary: #8f8f96;
    --text-tertiary: #616166;
    --hover: #232327;
    --active: #2a2a30;
    --accent: #3d7fff;
    --accent-soft: rgba(61,127,255,0.15);
    --danger: #ff5c5c;
    --star: #ffc94d;
    --shadow: rgba(0,0,0,0.4);
    --radius-lg: 16px;
    --radius-md: 10px;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; height:100%; overscroll-behavior: none; }
  body{
    background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    height: 100vh; overflow: hidden;
    -webkit-touch-callout: none;
  }
  button, input, textarea, select{ font-family: inherit; }
  svg{ display:block; }

    expand: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>`,
    collapse: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3v3a2 2 0 0 1-2 2H4"/><path d="M15 3v3a2 2 0 0 0 2 2h3"/><path d="M9 21v-3a2 2 0 0 0-2-2H4"/><path d="M15 21v-3a2 2 0 0 1 2-2h3"/></svg>`,
    hand: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v5"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8.5a2 2 0 0 1 4 0V13a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-6.14-3.11l-3.28-4.5a1.8 1.8 0 0 1 .5-2.29 1.8 1.8 0 0 1 2.4.13L8 14"/></svg>`,
  };

  let notes = [];
  let folders = [];
  let theme = 'dark';
  let activeId = null; // note id | '__trash__' | null
  let query = '';
  let previewMode = false;
  let saveTimer = null;
  let mobileShowingMain = false;
  let undoStack = [], redoStack = [];
  let checkpointed = false;
  let drawState = { color: '#ffffff', erasing: false, colorPopoverOpen: false, bgPopoverOpen: false, eraserPopoverOpen: false, fingerDraw: false, eraserSize: 18 };

  function updateEraserCursorSize(){
    const c = document.getElementById('eraserCursor');
    if(!c) return;
    const s = drawState.eraserSize;
    c.style.width = s + 'px'; c.style.height = s + 'px';
    c.style.marginLeft = (-s/2) + 'px'; c.style.marginTop = (-s/2) + 'px';
  }
  let focusMode = false;

  // browsing state for the grid
  let nav = 'home';          // 'home' | 'notes' | 'gallery' | 'folder'
  let activeFolderId = null; // when nav === 'folder'

  const settingsBtn = document.getElementById('settingsBtn');

  function uid(p){ return (p||'n_') + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(ts){ const d = new Date(ts); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
  function hexToRgba(hex, a){ const h = hex.replace('#',''); const r=parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16); return `rgba(${r},${g},${b},${a})`; }

  // ---------- persistence (on-device localStorage — data lives in Safari on this iPad) ----------
  const STORE_PREFIX = 'ipadnotes:';
  async function loadState(){
    try{ const v = localStorage.getItem(STORE_PREFIX+'notes'); notes = v ? JSON.parse(v) : []; }catch(e){ notes = []; }
    try{ const v = localStorage.getItem(STORE_PREFIX+'folders'); folders = v ? JSON.parse(v) : []; }catch(e){ folders = []; }
    try{ const v = localStorage.getItem(STORE_PREFIX+'theme'); theme = v || 'dark'; }catch(e){ theme = 'dark'; }
  }
  let toastTimer = null;
  function showToast(text){
    const el = document.getElementById('saveToast');
    if(!el) return;
    document.getElementById('saveToastText').textContent = text || 'Saved';
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1200);
  }
  async function persistNotes(){
    try{ localStorage.setItem(STORE_PREFIX+'notes', JSON.stringify(notes)); showToast('Saved'); }
    catch(e){ console.error('Save failed — storage may be full', e); alert('Could not save. Your device storage may be full — try exporting a backup and clearing some old notes.'); }
  }
  async function persistFolders(){ try{ localStorage.setItem(STORE_PREFIX+'folders', JSON.stringify(folders)); }catch(e){ console.error(e); } }
  async function persistTheme(){ try{ localStorage.setItem(STORE_PREFIX+'theme', theme); }catch(e){ console.error(e); } }
  function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(persistNotes, 350); }

  // ---------- backup / restore to a real file ----------
  function backupToFile(){
    const payload = { app: 'ipad-notes-backup', version: 1, exportedAt: Date.now(), notes, folders };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().slice(0,10);
    const a = document.createElement('a');
    a.href = url; a.download = `notes-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function restoreFromFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const payload = JSON.parse(reader.result);
        if(!payload || !Array.isArray(payload.notes)) throw new Error('bad file');
        const mode = confirm(`This backup has ${payload.notes.length} note(s) and ${payload.folders ? payload.folders.length : 0} folder(s).\n\nOK = Merge into your current notes\nCancel = Replace everything with this backup`);
        checkpoint();
        if(mode){
          const existingIds = new Set(notes.map(n => n.id));
          payload.notes.forEach(n => { if(!existingIds.has(n.id)) notes.push(n); });
          const existingFolderIds = new Set(folders.map(f => f.id));
          (payload.folders||[]).forEach(f => { if(!existingFolderIds.has(f.id)) folders.push(f); });
        } else {
          notes = payload.notes;
          folders = payload.folders || [];
        }
        commitMutation(); persistFolders(); renderAll();
        alert('Backup restored.');
      }catch(e){
        alert('Could not read that file — is it a Notes backup .json?');
      }
    };
    reader.readAsText(file);
  }

  // ---------- undo/redo ----------
  function checkpoint(){ if(checkpointed) return; undoStack.push(clone(notes)); if(undoStack.length>50) undoStack.shift(); redoStack=[]; checkpointed=true; }
  function commitMutation(){ checkpointed=false; scheduleSave(); }
  function doUndo(){ if(!undoStack.length) return; redoStack.push(clone(notes)); notes=undoStack.pop(); checkpointed=false; scheduleSave(); renderAll(); }
  function doRedo(){ if(!redoStack.length) return; undoStack.push(clone(notes)); notes=redoStack.pop(); checkpointed=false; scheduleSave(); renderAll(); }

  // ---------- markdown ----------
  function renderMarkdown(src){
    let s = escapeHtml(src||'');
    s = s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>')
         .replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>')
         .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')
         .replace(/`(.+?)`/g,'<code>$1</code>')
         .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    const lines = s.split('\n'); let out=[], inList=false, listType=null;
    for(let line of lines){
      const ol=/^\d+\.\s+(.*)$/.exec(line), ul=/^[-*]\s+(.*)$/.exec(line);
      if(ol||ul){ const type = ol?'ol':'ul';
        if(!inList||listType!==type){ if(inList) out.push('</'+listType+'>'); out.push('<'+type+'>'); inList=true; listType=type; }
        out.push('<li>'+(ol?ol[1]:ul[1])+'</li>');
      } else {
        if(inList){ out.push('</'+listType+'>'); inList=false; listType=null; }
        if(line.trim()==='') out.push('');
        else if(/^<h[1-3]>|^<blockquote>/.test(line)) out.push(line);
        else out.push('<p>'+line+'</p>');
      }
    }
    if(inList) out.push('</'+listType+'>');
    return out.join('\n');
  }

  // ---------- filtering ----------
  function matchesQuery(n){
    if(!query.trim()) return true;
    const q = query.toLowerCase();
    return (n.title||'').toLowerCase().includes(q) || (n.body||'').toLowerCase().includes(q) || (n.tags||[]).some(t=>t.toLowerCase().includes(q));
  }
  const activeNotes = () => notes.filter(n => !n.trashed);
  const trashedNotes = () => notes.filter(n => n.trashed).sort((a,b)=>(b.trashedAt||0)-(a.trashedAt||0));
  const folderById = (id) => folders.find(f => f.id === id);

  function currentNoteSet(){
    let list = activeNotes().filter(matchesQuery);
    if(nav === 'gallery') list = list.filter(n => (n.mode||'text') === 'draw');
    if(nav === 'folder') list = list.filter(n => n.folderId === activeFolderId);
    if(nav === 'notes' || nav === 'home'){
      if(tab === 'favorites') list = list.filter(n => n.pinned);
      else if(tab === 'unfiled') list = list.filter(n => !n.folderId);
      // 'recents' and 'all' both show everything, recents just sorts differently
    }
    if((nav === 'notes' || nav === 'home') && tab === 'recents'){
      list = list.slice().sort((a,b)=>b.updatedAt-a.updatedAt).slice(0, 12);
    } else {
      list = list.slice().sort((a,b)=>b.updatedAt-a.updatedAt);
    }
    return list;
  }

  function setupCanvas(note){
    const canvas = document.getElementById('drawCanvas');
    if(!canvas) return;
    const wrap = document.getElementById('canvasWrapEl');
    const scrollEl = document.getElementById('canvasScroll');
    const ratio = window.devicePixelRatio || 1;
    let cssH = note.canvasHeight || DEFAULT_CANVAS_HEIGHT;

    function sizeCanvasTo(newCssH, preserveOldCssH){
      const cssW = wrap.clientWidth;
      wrap.style.height = newCssH + 'px';
      canvas.width = cssW * ratio; canvas.height = newCssH * ratio;
      canvas.style.height = newCssH + 'px';
      const ctx2 = canvas.getContext('2d');
      ctx2.scale(ratio, ratio); ctx2.lineCap = 'round'; ctx2.lineJoin = 'round';
      if(note.drawing){
        const img = new Image();
        img.onload = () => ctx2.drawImage(img, 0, 0, cssW, preserveOldCssH || newCssH);
        img.src = note.drawing;
      }
      cssH = newCssH;
      note.canvasHeight = newCssH;
      renderPageSeams(wrap, newCssH);
      return ctx2;
    }

    let ctx = sizeCanvasTo(cssH, cssH);
    let growing = false;
    function growIfNear(edgeY){
      if(growing) return;
      if(cssH - edgeY < GROW_MARGIN){
        growing = true;
        const oldH = cssH;
        ctx = sizeCanvasTo(cssH + GROW_STEP, oldH);
        commitMutation();
        setTimeout(() => { growing = false; }, 30);
      }
    }

    let drawing = false, lastX = 0, lastY = 0;
    let p1x = 0, p1y = 0, p2x = 0, p2y = 0; // rolling point buffer for curve smoothing
    function pos(e){ const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

    const eraserCursor = document.getElementById('eraserCursor');
    updateEraserCursorSize();
    function moveEraserCursor(x, y){
      if(!eraserCursor || !drawState.erasing) return;
      eraserCursor.style.left = x + 'px';
      eraserCursor.style.top = y + 'px';
    }
    function showEraserCursor(){ if(eraserCursor && drawState.erasing) eraserCursor.classList.add('show'); }
    function hideEraserCursor(){ if(eraserCursor) eraserCursor.classList.remove('show'); }

    function saveDrawing(){
      checkpoint();
      note.drawing = canvas.toDataURL('image/png');
      note.updatedAt = Date.now();
      commitMutation();
    }

    // Gesture routing: pen/stylus and mouse always draw. A bare finger touch
    // scrolls by default (one finger is enough — no need to bring in a second
    // finger just to scroll), unless "Draw with finger" is toggled on, in
    // which case a single finger draws instead and two fingers scroll.
    let activePointers = new Map(); // pointerId -> {x, y}
    let gestureMode = 'idle'; // 'draw' | 'scroll' | 'idle'
    let scrollStartY = 0, scrollStartTop = 0;

    function avgY(){
      const pts = Array.from(activePointers.values());
      return pts.reduce((s, p) => s + p.y, 0) / pts.length;
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      const isTouch = e.pointerType === 'touch';
      const shouldScroll = isTouch
        ? (drawState.fingerDraw ? activePointers.size >= 2 : true)
        : false;

      if(shouldScroll){
        // Finger touch (in default mode), or a second finger, or Scroll mode
        // explicitly on — abandon any in-progress stroke and scroll instead.
        drawing = false;
        gestureMode = 'scroll';
        scrollStartY = avgY();
        scrollStartTop = scrollEl.scrollTop;
        hideEraserCursor();
        return;
      }

      gestureMode = 'draw';
      drawing = true;
      try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
      [lastX, lastY] = pos(e);
      p1x = p2x = lastX; p1y = p2y = lastY;
      moveEraserCursor(lastX, lastY);
      showEraserCursor();
      // draw a dot immediately in case the stroke ends right here without moving
      const startPressure = e.pressure && e.pressure > 0 ? e.pressure : 0.5;
      const startWidth = drawState.erasing ? drawState.eraserSize : Math.max(1.2, startPressure * 6);
      ctx.globalCompositeOperation = drawState.erasing ? 'destination-out' : 'source-over';
      ctx.strokeStyle = drawState.color;
      ctx.lineWidth = startWidth;
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(lastX, lastY); ctx.stroke();
    });

    canvas.addEventListener('pointermove', (e) => {
      if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if(gestureMode === 'scroll'){
        const delta = scrollStartY - avgY();
        scrollEl.scrollTop = scrollStartTop + delta;
        return;
      }

      const [hx, hy] = pos(e);
      moveEraserCursor(hx, hy);
      if(e.pointerType !== 'touch') showEraserCursor();

      if(gestureMode !== 'draw' || !drawing) return;

      // Use getCoalescedEvents so fast strokes (especially with an Apple
      // Pencil / stylus) don't skip the many sub-frame points the browser
      // has actually recorded — without this, quick strokes look sparse
      // and jagged even though the hardware sampled far more points.
      let events = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
      if(!events.length) events = [e];

      events.forEach(ev => {
        const [x, y] = pos(ev);
        const pressure = ev.pressure && ev.pressure > 0 ? ev.pressure : 0.5;
        const width = drawState.erasing ? drawState.eraserSize : Math.max(1.2, pressure * 6);
        ctx.globalCompositeOperation = drawState.erasing ? 'destination-out' : 'source-over';
        ctx.strokeStyle = drawState.color;
        ctx.lineWidth = width;

        // Quadratic-curve smoothing: draw through the midpoints of
        // consecutive raw points, using the middle point as the control
        // point. This rounds off the faceted, angular look you get from
        // just connecting raw points with straight lineTo segments.
        const c1x = (p1x + p2x) / 2, c1y = (p1y + p2y) / 2;
        const c2x = (p2x + x) / 2, c2y = (p2y + y) / 2;
        ctx.beginPath();
        ctx.moveTo(c1x, c1y);
        ctx.quadraticCurveTo(p2x, p2y, c2x, c2y);
        ctx.stroke();

        p1x = p2x; p1y = p2y; p2x = x; p2y = y;
        growIfNear(y);
      });

      lastX = p2x; lastY = p2y;
      moveEraserCursor(lastX, lastY);
    });

    function endPointer(e){
      activePointers.delete(e.pointerId);
      hideEraserCursor();
      if(gestureMode === 'scroll'){
        if(activePointers.size === 0) gestureMode = 'idle';
        return;
      }
      if(gestureMode === 'draw' && drawing){
        drawing = false; gestureMode = 'idle';
        saveDrawing(); growIfNear(lastY);
      }
    }
    ['pointerup','pointerleave','pointercancel'].forEach(evt => canvas.addEventListener(evt, endPointer));
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // grow the page as you scroll toward the bottom too, not just while drawing —
    // makes it feel like one continuous, endless page instead of a fixed sheet
    scrollEl.addEventListener('scroll', () => {
      growIfNear(scrollEl.scrollTop + scrollEl.clientHeight);
    }, { passive: true });

    // resume scroll position near where they left off (bottom of drawn content) on first open
    if(note.drawing) requestAnimationFrame(() => { scrollEl.scrollTop = 0; });
  }

  function renderPageSeams(wrap, totalHeight){
    wrap.querySelectorAll('.page-seam').forEach(el => el.remove());
    const seamGap = 1100; // visual "page" height for the paper-seam guide lines
    for(let y = seamGap; y < totalHeight; y += seamGap){
      const seam = document.createElement('div');
      seam.className = 'page-seam';
      seam.style.top = y + 'px';
      wrap.appendChild(seam);
    }
  }

  function isBlankNote(note){
    return !note.title.trim() && !note.body.trim() && !note.drawing && (!note.tags || note.tags.length === 0);
  }
  function closeEditor(note){
    if(isBlankNote(note)){
      notes = notes.filter(n => n.id !== note.id);
      scheduleSave();
    }
    activeId = null; mobileShowingMain = false; folderPickerOpen = false;
    focusMode = false;
    document.getElementById('app').classList.remove('focus-mode');
    renderAll();
  }

  function wirePage(note, mode){
    const backBtn = document.getElementById('backBtn');
    if(backBtn) backBtn.addEventListener('click', () => { closeEditor(note); });
    document.getElementById('closeEditorBtn').addEventListener('click', () => { closeEditor(note); });

    document.getElementById('focusBtn').addEventListener('click', () => {
      focusMode = !focusMode;
      document.getElementById('app').classList.toggle('focus-mode', focusMode);
      renderPage(note);
    });
    document.getElementById('undoBtn').addEventListener('click', doUndo);
    document.getElementById('redoBtn').addEventListener('click', doRedo);

    mainEl.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
      checkpoint(); note.mode = b.dataset.mode; note.updatedAt = Date.now(); commitMutation(); renderAll();
    }));

    const previewBtn = document.getElementById('previewBtn');
    if(previewBtn) previewBtn.addEventListener('click', () => { previewMode = !previewMode; renderPage(note); });

    document.getElementById('favBtn').addEventListener('click', () => {
      checkpoint(); note.pinned = !note.pinned; note.updatedAt = Date.now(); commitMutation(); renderAll();
    });

    const exportBtn = document.getElementById('exportBtn');
    const exportMenu = document.getElementById('exportMenu');
    exportBtn.addEventListener('click', (e) => { e.stopPropagation(); exportMenu.classList.toggle('show'); });
    exportMenu.querySelectorAll('[data-export]').forEach(b => b.addEventListener('click', () => { exportNote(note, b.dataset.export); exportMenu.classList.remove('show'); }));

    document.getElementById('deleteBtn').addEventListener('click', () => {
      checkpoint();
      note.trashed = true; note.trashedAt = Date.now(); note.pinned = false;
      activeId = null; mobileShowingMain = false; folderPickerOpen = false;
      commitMutation(); renderAll();
    });

    document.getElementById('pageIcon').addEventListener('click', () => {
      checkpoint();
      const idx = ICON_CYCLE.indexOf(note.icon);
      note.icon = ICON_CYCLE[(idx + 1) % ICON_CYCLE.length];
      note.updatedAt = Date.now();
      commitMutation(); renderAll();
    });

    const titleInput = document.getElementById('titleInput');
    titleInput.addEventListener('focus', () => { checkpoint(); setTimeout(() => titleInput.scrollIntoView({block:'center', behavior:'smooth'}), 300); });
    titleInput.addEventListener('input', (e) => { note.title = e.target.value; note.updatedAt = Date.now(); commitMutation(); renderSidebar(); });

    const folderPickerBtn = document.getElementById('folderPickerBtn');
    const folderPickerMenu = document.getElementById('folderPickerMenu');
    folderPickerBtn.addEventListener('click', (e) => { e.stopPropagation(); folderPickerOpen = !folderPickerOpen; folderPickerMenu.classList.toggle('show', folderPickerOpen); });
    folderPickerMenu.querySelectorAll('[data-set-folder]').forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      checkpoint(); note.folderId = b.dataset.setFolder || null; note.updatedAt = Date.now(); folderPickerOpen = false;
      commitMutation(); renderAll();
    }));

    const tagAddInput = document.getElementById('tagAddInput');
    tagAddInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        const val = tagAddInput.value.trim().replace(/^#/, '');
        if(val){
          checkpoint();
          note.tags = note.tags || [];
          if(!note.tags.includes(val)) note.tags.push(val);
          note.updatedAt = Date.now();
          commitMutation(); renderPage(note);
          setTimeout(() => document.getElementById('tagAddInput')?.focus(), 20);
        }
      }
    });
    document.getElementById('tagChipRow').addEventListener('click', (e) => {
      const b = e.target.closest('[data-remove-tag]'); if(!b) return;
      checkpoint();
      note.tags = (note.tags||[]).filter(t => t !== b.dataset.removeTag);
      note.updatedAt = Date.now();
      commitMutation(); renderPage(note);
    });

    if(mode === 'draw'){
      setupCanvas(note);
      document.getElementById('cvUndoBtn').addEventListener('click', doUndo);
      document.getElementById('cvRedoBtn').addEventListener('click', doRedo);

      const penBtn = document.getElementById('penBtn');
      const colorPopover = document.getElementById('colorPopover');
      const bgBtn = document.getElementById('bgBtn');
      const bgPopover = document.getElementById('bgPopover');
      const eraserPopover = document.getElementById('eraserPopover');

      penBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = drawState.colorPopoverOpen && !drawState.erasing;
        drawState.erasing = false;
        drawState.colorPopoverOpen = !wasOpen;
        drawState.bgPopoverOpen = false;
        drawState.eraserPopoverOpen = false;
        renderPage(note);
      });
      mainEl.querySelectorAll('[data-color]').forEach(s => s.addEventListener('click', (e) => {
        e.stopPropagation();
        drawState.color = s.dataset.color; drawState.erasing = false; drawState.colorPopoverOpen = false;
        renderPage(note);
      }));
      const customColorInput = document.getElementById('customColorInput');
      customColorInput.addEventListener('input', (e) => {
        drawState.color = e.target.value; drawState.erasing = false;
      });
      customColorInput.addEventListener('change', () => { drawState.colorPopoverOpen = false; renderPage(note); });

      document.getElementById('eraserBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = drawState.eraserPopoverOpen && drawState.erasing;
        drawState.erasing = true;
        drawState.eraserPopoverOpen = !wasOpen;
        drawState.colorPopoverOpen = false; drawState.bgPopoverOpen = false;
        renderPage(note);
      });

      const eraserSizeSlider = document.getElementById('eraserSizeSlider');
      if(eraserSizeSlider){
        eraserSizeSlider.addEventListener('input', (e) => {
          e.stopPropagation();
          drawState.eraserSize = parseInt(e.target.value, 10);
          const dot = document.getElementById('eraserPreviewDot');
          const label = document.getElementById('eraserSizeLabel');
          if(dot){ dot.style.width = drawState.eraserSize + 'px'; dot.style.height = drawState.eraserSize + 'px'; }
          if(label) label.textContent = drawState.eraserSize + 'px';
          updateEraserCursorSize();
        });
        eraserSizeSlider.addEventListener('click', (e) => e.stopPropagation());
      }
      if(eraserPopover) eraserPopover.addEventListener('click', (e) => e.stopPropagation());

      document.getElementById('panBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        drawState.fingerDraw = !drawState.fingerDraw;
        drawState.colorPopoverOpen = false; drawState.bgPopoverOpen = false; drawState.eraserPopoverOpen = false;
        renderPage(note);
      });

      bgBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        drawState.bgPopoverOpen = !drawState.bgPopoverOpen;
        drawState.colorPopoverOpen = false;
        drawState.eraserPopoverOpen = false;
        renderPage(note);
      });
      mainEl.querySelectorAll('[data-bgswatch]').forEach(s => s.addEventListener('click', (e) => {
        e.stopPropagation();
        checkpoint();
        const chosen = s.dataset.bgswatch;
        const wasDark = ['dark-dot','black'].includes(note.canvasBg || 'dark-dot');
        const nowDark = ['dark-dot','black'].includes(chosen);
        if(wasDark !== nowDark){
          if(drawState.color === '#ffffff' && nowDark === false) drawState.color = '#000000';
          else if(drawState.color === '#000000' && nowDark === true) drawState.color = '#ffffff';
        }
        note.canvasBg = chosen;
        note.updatedAt = Date.now();
        drawState.bgPopoverOpen = false;
        commitMutation(); renderPage(note);
      }));

      document.getElementById('clearCanvasBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        if(!confirm('Clear this drawing?')) return;
        checkpoint(); note.drawing = null; note.canvasHeight = DEFAULT_CANVAS_HEIGHT; note.updatedAt = Date.now(); commitMutation(); renderPage(note);
      });
    } else if(!previewMode){
      const bodyInput = document.getElementById('bodyInput');
      bodyInput.addEventListener('focus', () => { checkpoint(); setTimeout(() => bodyInput.scrollIntoView({block:'center', behavior:'smooth'}), 300); });
      bodyInput.addEventListener('input', (e) => { note.body = e.target.value; note.updatedAt = Date.now(); commitMutation(); renderSidebar(); });
    }
  }

  // ---------- export ----------
  function exportNote(note, kind){
    const safeTitle = (note.title || 'untitled').replace(/[^a-z0-9\-_ ]/gi,'').trim().replace(/\s+/g,'-').toLowerCase() || 'untitled';
    if(kind === 'md' || kind === 'txt'){
      const content = kind === 'md' ? `# ${note.title || 'Untitled'}\n\n${note.body || ''}` : `${note.title || 'Untitled'}\n\n${note.body || ''}`;
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `${safeTitle}.${kind}`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    } else if(kind === 'pdf'){
      const printArea = document.getElementById('printArea');
      const bodyHtml = note.mode === 'draw' && note.drawing
        ? `<img src="${note.drawing}" style="max-width:100%;" />`
        : `<div style="white-space:pre-wrap; line-height:1.6;">${escapeHtml(note.body || '')}</div>`;
      printArea.innerHTML = `<h1 style="font-family:Georgia,serif;">${note.icon||''} ${escapeHtml(note.title || 'Untitled')}</h1>${bodyHtml}`;
      window.print();
    }
  }

  // ---------- new note / folder ----------
  function createNote(folderId){
    checkpoint();
    const note = {
      id: uid(), title: '', body: '', mode: 'text', drawing: null, canvasBg: 'dark-dot', canvasHeight: DEFAULT_CANVAS_HEIGHT,
      icon: ICON_CYCLE[0], tags: [], folderId: folderId || null,
      pinned: false, trashed: false, trashedAt: null,
      createdAt: Date.now(), updatedAt: Date.now(),
    };
    notes.unshift(note);
    activeId = note.id; mobileShowingMain = true; previewMode = false; folderPickerOpen = false;
    commitMutation(); renderAll();
    setTimeout(() => document.getElementById('titleInput')?.focus(), 30);
  }
  function addFolder(){
    const input = document.getElementById('newFolderInput');
    const name = input.value.trim(); if(!name) return;
    const color = FOLDER_COLORS[folders.length % FOLDER_COLORS.length];
    folders.push({ id: uid('f_'), name, color }); input.value = '';
    document.getElementById('newFolderRow').style.display = 'none';
    persistFolders(); renderAll();
  }

  // ---------- theme ----------
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', theme);
    settingsBtn.innerHTML = ICONS.gear;
    settingsBtn.title = 'Settings';
  }
  settingsBtn.addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(); persistTheme(); });

  document.getElementById('backupBtn').innerHTML = ICONS.download;
  document.getElementById('backupBtn').addEventListener('click', backupToFile);
  document.getElementById('restoreBtn').innerHTML = ICONS.upload;
  const restoreFileInput = document.getElementById('restoreFileInput');
  document.getElementById('restoreBtn').addEventListener('click', () => restoreFileInput.click());
  restoreFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file) restoreFromFile(file);
    restoreFileInput.value = '';
  });

  document.getElementById('showNewFolder').addEventListener('click', () => {
    const row = document.getElementById('newFolderRow');
    const nextColor = FOLDER_COLORS[folders.length % FOLDER_COLORS.length];
    document.getElementById('newFolderDot').style.background = nextColor;
    row.style.display = row.style.display === 'none' ? 'block' : 'none';
    if(row.style.display === 'block') document.getElementById('newFolderInput').focus();
  });

  document.addEventListener('click', () => {
    document.querySelectorAll('.menu-pop').forEach(m => m.classList.remove('show'));
    const fpm = document.getElementById('folderPickerMenu');
    if(fpm && folderPickerOpen){ folderPickerOpen = false; fpm.classList.remove('show'); }
    if(drawState.colorPopoverOpen || drawState.bgPopoverOpen || drawState.eraserPopoverOpen){
      drawState.colorPopoverOpen = false; drawState.bgPopoverOpen = false; drawState.eraserPopoverOpen = false;
      const note = notes.find(n => n.id === activeId);
      if(note && (note.mode||'text') === 'draw') renderPage(note);
    }
  });

  window.addEventListener('keydown', (e) => {
    const tagName = (e.target.tagName || '').toLowerCase();
    const inField = tagName === 'input' || tagName === 'textarea';
    const mod = e.ctrlKey || e.metaKey;
    if(!mod) return;
    const key = e.key.toLowerCase();
    if(key === 'n'){ e.preventDefault(); createNote(nav==='folder'?activeFolderId:null); }
    else if(key === 'f'){ e.preventDefault(); searchInputEl.focus(); }
    else if(key === 'z' && !inField){ e.preventDefault(); if(e.shiftKey) doRedo(); else doUndo(); }
    else if(key === 'y' && !inField){ e.preventDefault(); doRedo(); }
    else if(key === 'backspace' && activeId && activeId !== '__trash__'){
      e.preventDefault();
      const note = notes.find(n => n.id === activeId);
      if(note && !note.trashed){
        checkpoint(); note.trashed = true; note.trashedAt = Date.now(); note.pinned = false;
        activeId = null; mobileShowingMain = false;
        commitMutation(); renderAll();
      }
    }
  });

  document.getElementById('trashRow').addEventListener('click', () => { activeId = '__trash__'; mobileShowingMain = true; renderAll(); });
  document.getElementById('newFolderInput').addEventListener('keydown', e => { if(e.key === 'Enter') addFolder(); });
  const newFolderAddBtn = document.getElementById('newFolderAddBtn');
  const newFolderInputEl = document.getElementById('newFolderInput');
  newFolderInputEl.addEventListener('input', () => { newFolderAddBtn.disabled = !newFolderInputEl.value.trim(); });
  newFolderAddBtn.addEventListener('click', (e) => { e.stopPropagation(); addFolder(); });
  searchInputEl.addEventListener('input', e => { query = e.target.value; renderSidebar(); renderMain(); });
  window.addEventListener('resize', renderAll);

  function renderAll(){
    renderSidebar();
    renderMain();
    sidebarEl.classList.toggle('hide-mobile', mobileShowingMain && window.innerWidth <= 780);
  }

  (async function init(){
    await loadState();
    applyTheme();
    renderAll();
  })();
})();
</script>
