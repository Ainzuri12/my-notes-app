<body>
<style>
  :root{
    --bg: #0a0a0b;
    --sidebar-bg: #131316;
    --panel: #1b1b1f;
    --card: #1c1c20;
    --card-hover: #232327;
    --border: #2a2a2e;
    --text: #f1f1f2;
    --text-secondary: #8f8f96;
    --text-tertiary: #616166;
    --hover: #232327;
    --active: #2a2a30;
    --accent: #3d7fff;
    --accent-soft: rgba(61,127,255,0.15);
    --danger: #ff5c5c;
    --star: #ffc94d;
    --shadow: rgba(0,0,0,0.4);
    --radius-lg: 16px;
    --radius-md: 10px;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; height:100%; overscroll-behavior: none; }
  body{
    background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    height: 100vh; overflow: hidden;
    -webkit-touch-callout: none;
  }
  button, input, textarea, select{ font-family: inherit; }
  svg{ display:block; }
  input:focus, textarea:focus, button:focus{ outline: none; }
  button, .sb-item, .folder-row, .note-card, .tab-btn, .card-del, .f-del, .fdot, .icon-btn, .sb-brand, .page-icon{
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  input, textarea, .body-preview, .card-title, .card-date{ -webkit-user-select: text; user-select: text; }

  .toast{ position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(10px); background: rgba(28,28,30,0.92); backdrop-filter: blur(8px);
    color: var(--text); font-size: 12.5px; font-weight:500; padding: 9px 16px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    opacity:0; pointer-events:none; transition: opacity .25s ease, transform .25s ease; z-index: 999; display:flex; align-items:center; gap:7px; }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
  .toast .dot{ width:6px; height:6px; border-radius:50%; background:#4ade80; flex-shrink:0; }

  .update-banner{ position: fixed; top: 0; left: 0; right: 0; background: var(--accent, #4a7fff); color: #fff;
    font-size: 13px; font-weight:600; padding: 10px 16px; display:flex; align-items:center; justify-content:center; gap:12px;
    z-index: 1000; transform: translateY(-100%); transition: transform .25s ease;
    padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
  .update-banner.show{ transform: translateY(0); }
  .update-banner button{ background: rgba(255,255,255,0.2); color:#fff; border:none; border-radius:8px; padding:4px 12px;
    font-size:12.5px; font-weight:700; cursor:pointer; }
  .update-banner button:active{ background: rgba(255,255,255,0.32); }

  .app{ display: grid; grid-template-columns: 250px 1fr; height: 100%; transition: grid-template-columns .18s ease; }
  .app.focus-mode{ grid-template-columns: 0px 1fr; }
  .app.focus-mode .sidebar{ display: none; }
  @media (max-width: 780px){
    .app{ grid-template-columns: 1fr; }
    .sidebar{ display: flex; grid-column: 1; }
    .sidebar.hide-mobile{ display: none; }
    .main{ display: none; grid-column: 1; }
    .main.show-mobile{ display: flex; }
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{ background: var(--sidebar-bg); border-right: 1px solid var(--border); display:flex; flex-direction:column; min-height:0; grid-column: 1; }
  .sb-head{ padding: calc(18px + env(safe-area-inset-top)) 16px 12px calc(16px + env(safe-area-inset-left)); display:flex; align-items:center; justify-content:space-between; }
  .sb-brand{ font-weight:800; font-size:16px; letter-spacing:-.2px; display:flex; align-items:center; gap:8px; }
  .sb-brand .dot{ width:9px; height:9px; border-radius:3px; background: var(--accent); flex-shrink:0; }
  .icon-btn{ background:none; border:none; cursor:pointer; color: var(--text-secondary); padding:7px; display:flex; align-items:center; border-radius:8px; }
  .icon-btn:hover{ background: var(--hover); color: var(--text); }
  .icon-btn svg{ width:16px; height:16px; }

  .sb-search{ margin: 0 16px 14px 16px; display:flex; align-items:center; gap:8px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
  .sb-search svg{ width:14px; height:14px; color: var(--text-tertiary); flex-shrink:0; }
  .sb-search input{ border:none; background:transparent; outline:none; color: var(--text); font-size:13px; width:100%; }
  .sb-search input::placeholder{ color: var(--text-tertiary); }

  .sb-nav{ padding: 0 10px; display:flex; flex-direction:column; gap:1px; }
  .sb-item{ display:flex; align-items:center; gap:10px; padding: 8px 10px; border-radius:9px; cursor:pointer; font-size:13.5px; font-weight:500; color: var(--text-secondary); }
  .sb-item:hover{ background: var(--hover); color: var(--text); }
  .sb-item.active{ background: var(--active); color: var(--text); }
  .sb-item svg{ width:16px; height:16px; flex-shrink:0; }
  .sb-item .lbl{ flex:1; }
  .sb-item .count{ font-size:11px; color: var(--text-tertiary); background: var(--panel); padding: 1px 7px; border-radius:20px; }
  .sb-item.active .count{ color: var(--text); }

  .sb-section{ padding: 16px 0 0 0; }
  .sb-section-label{ font-size:11px; font-weight:700; color: var(--text-tertiary); padding: 4px 20px; text-transform: uppercase; letter-spacing:.6px; display:flex; justify-content:space-between; align-items:center; }
  .sb-section-label .add-mini{ background:none; border:none; cursor:pointer; color: var(--text-tertiary); padding:2px; border-radius:5px; display:flex; }
  .sb-section-label .add-mini:hover{ background: var(--hover); color: var(--text); }
  .sb-section-label .add-mini svg{ width:13px; height:13px; }

  .folder-row{ display:flex; align-items:center; gap:10px; padding: 7px 10px 7px 20px; margin: 0 10px; border-radius:9px; cursor:pointer; font-size:13.5px; color: var(--text-secondary); position:relative; }
  .folder-row:hover{ background: var(--hover); color: var(--text); }
  .folder-row.active{ background: var(--active); color: var(--text); font-weight:500; }
  .folder-row .fdot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .folder-row .fname{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .folder-row .fcount{ font-size:11px; color: var(--text-tertiary); }
  .folder-row .f-del{ opacity:0; background:none; border:none; cursor:pointer; color: var(--text-tertiary); padding:2px; border-radius:4px; display:flex; flex-shrink:0; }
  .folder-row:hover .f-del{ opacity:1; }
  .folder-row .f-del:hover{ background: var(--border); color: var(--danger); }

  .new-folder-row{ padding: 6px 20px 4px 20px; }
  .new-folder-row .nf-inner{ display:flex; align-items:center; gap:8px; border:1px dashed var(--border); border-radius:9px; padding:6px 9px; }
  .new-folder-row .fdot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .new-folder-row input{ flex:1; background:transparent; border:none; font-size:12.5px; color: var(--text); outline:none; min-width:0; }
  .new-folder-row input::placeholder{ color: var(--text-tertiary); }
  .new-folder-row .nf-add{ background: var(--accent); border:none; color:#fff; width:22px; height:22px; border-radius:7px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .new-folder-row .nf-add svg{ width:13px; height:13px; }
  .new-folder-row .nf-add:disabled{ opacity:.35; cursor:default; }

  .sidebar-spacer{ flex:1; }
  .sb-bottom{ border-top: 1px solid var(--border); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); }
  .trash-row.active{ background: var(--active); color: var(--text); }

  /* ---------- MAIN / GRID ---------- */
  .main{ display:flex; flex-direction:column; min-height:0; min-width:0; grid-column: 2; }
  .mobile-back{ display:none; background:none; border:none; color: var(--text-secondary); font-size:13px; padding: 14px 20px 0 20px; cursor:pointer; text-align:left; align-items:center; gap:6px; }
  .mobile-back svg{ width:14px; height:14px; }
  @media (max-width: 780px){ .mobile-back{ display:flex; } }

  .grid-scroll{ flex:1; overflow-y:auto; }

  /* tool settings sheet */

<script>
(function(){
  const ICON_CYCLE = ['📄','📝','🗒️','📋','🖊️','✏️','📑','💡','📚','🔖','🗂️','🎯','✅','🌱','🔥','⭐'];
  const INK_COLORS = ['#ffffff', '#000000', '#eb5757', '#f5a623', '#f7d34c', '#0f9d58', '#2383e2', '#9b59e0', '#ff7ab8'];
  const BG_OPTIONS = ['grid', 'light-dot', 'white', 'cream', 'dark-dot', 'black'];
  const PAPER_TEMPLATES = [
    { id:'plain',        name:'Plain',        group:'Basic Templates' },
    { id:'rule',         name:'Rule',         group:'Basic Templates' },
    { id:'grid',         name:'Grid',         group:'Basic Templates' },
    { id:'dot',          name:'Dot',          group:'Basic Templates' },
    { id:'cornell-rule', name:'Cornell Rule', group:'Education' },
    { id:'cornell-grid', name:'Cornell grid', group:'Education' },
    { id:'mckinsey',     name:'McKinsey',     group:'Education' },
    { id:'staff',        name:'Staff',        group:'Education' },
  ];
  const PAPER_COLORS = ['#ffffff', '#f7f1e1', '#2c2c2e', '#000000'];
  const PAPER_LINE_COLORS = ['#9aa0a6', '#5b9cf6', '#e2564a', '#111111'];
  const LEGACY_BG = {
    'grid':      { template:'grid',  paperColor:'#ffffff' },
    'light-dot': { template:'dot',   paperColor:'#ffffff' },
    'white':     { template:'plain', paperColor:'#ffffff' },
    'cream':     { template:'rule',  paperColor:'#f5efe0' },
    'dark-dot':  { template:'dot',   paperColor:'#1c1c1e', lineColor:'#8a8a8e' },
    'black':     { template:'plain', paperColor:'#000000', lineColor:'#8a8a8e' },
  };
  // Every note carries a paper description: which template (plain/rule/grid/
  // dot/cornell/…), the sheet colour, the rule colour and the line spacing.
  // Older notes only stored a canvasBg keyword, so migrate those on read.
  function getPaper(note){
    if(!note.paper){
      const l = LEGACY_BG[note.canvasBg || 'grid'] || LEGACY_BG.grid;
      note.paper = { template: l.template, paperColor: l.paperColor, lineColor: l.lineColor || '#9aa0a6', spacing: 5, direction: 'Vertical', size: 'A4' };
    }
    const p = note.paper;
    return {
      template: p.template || 'grid',
      paperColor: p.paperColor || '#ffffff',
      lineColor: p.lineColor || '#9aa0a6',
      spacing: (p.spacing == null ? 5 : p.spacing),
      direction: p.direction || 'Vertical',
      size: p.size || 'A4',
    };
  }
  function hexRgba(hex, a){
    let h = String(hex || '#000000').replace('#','');
    if(h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16) || 0;
    return `rgba(${(n>>16)&255}, ${(n>>8)&255}, ${n&255}, ${a})`;
  }
  function isDarkPaper(hex){
    let h = String(hex || '#ffffff').replace('#','');
    if(h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16) || 0;
    const lum = (0.299*((n>>16)&255) + 0.587*((n>>8)&255) + 0.114*(n&255)) / 255;
    return lum < 0.45;
  }
  // Build the CSS background layers for a paper description. `unit` lets the
  // little modal previews draw the same template at a smaller scale.
  function paperStyle(paper, unit){
    const u = unit || (6 + paper.spacing * 4);
    const c = hexRgba(paper.lineColor, 0.5);
    const cs = hexRgba(paper.lineColor, 1);
    const imgs = [], sizes = [], reps = [];
    const push = (img, size, rep) => { imgs.push(img); sizes.push(size); reps.push(rep || 'repeat'); };
    const hline = () => push(`repeating-linear-gradient(to bottom, ${c} 0 1px, transparent 1px ${u}px)`, `100% ${u}px`);
    const vline = () => push(`repeating-linear-gradient(to right, ${c} 0 1px, transparent 1px ${u}px)`, `${u}px 100%`);
    const dots  = () => push(`radial-gradient(circle, ${c} ${Math.max(1, u*0.045)}px, transparent ${Math.max(1.4, u*0.065)}px)`, `${u}px ${u}px`);
    const guide = (pos, dir) => push(
      `linear-gradient(${dir === 'v' ? '90deg' : '180deg'}, transparent 0 calc(${pos} - 2px), ${cs} calc(${pos} - 2px) ${pos}, transparent ${pos} 100%)`,
      '100% 100%', 'no-repeat');
    const staff = () => {
      const s = Math.max(4, Math.round(u * 0.42));
      const period = 4 * s + 1 + Math.round(u * 3);
      const stops = [];
      for(let i = 0; i < 5; i++){
        stops.push(`transparent ${i*s}px`, `${c} ${i*s}px`, `${c} ${i*s+1}px`, `transparent ${i*s+1}px`);
      }
      push(`linear-gradient(to bottom, ${stops.join(', ')}, transparent ${period}px)`, `100% ${period}px`);
    };
    switch(paper.template){
      case 'plain': break;
      case 'rule': hline(); break;
      case 'dot': dots(); break;

    const a = sat * Math.min(light, 1 - light);

  // Full hue/saturation colour wheel — hue around the circle, saturation out

  function drawColorWheel(canvas, light){
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2, R = Math.min(cx, cy);
    const img = ctx.createImageData(w, h);
    for(let y = 0; y < h; y++){
      for(let x = 0; x < w; x++){
        const dx = x - cx, dy = y - cy;
        const dist = Math.hypot(dx, dy);
        const i = (y * w + x) * 4;
        if(dist > R){ img.data[i + 3] = 0; continue; }
        const hue = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
        const hex = hslToHex(hue, Math.min(1, dist / R), light);
        img.data[i] = parseInt(hex.slice(1, 3), 16);
        img.data[i + 1] = parseInt(hex.slice(3, 5), 16);
        img.data[i + 2] = parseInt(hex.slice(5, 7), 16);
        img.data[i + 3] = dist > R - 1 ? Math.max(0, (R - dist) * 255) : 255;

  // Switched from localStorage to IndexedDB: same idea (data lives only in

  // A plain <a download> link on iOS Safari saves silently to a fixed
  // Downloads folder with no prompt — you never see where it went or get
  // to rename it, which is exactly what's confusing here. The fix is the
  // Web Share API: passing a real File to navigator.share() opens the
  // native share sheet, and choosing "Save to Files" from there shows
  // Apple's own folder picker — you see and choose exactly where it's
  // going. Falls back to a native save-location picker on desktop Chrome/
  // Edge, and only falls all the way back to a silent download if neither
  // is available at all.
  async function saveOrShareFile(blob, filename, mimeType){
    try{
      const file = new File([blob], filename, { type: mimeType });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], title: filename });
        return;
      }
    }catch(err){
      if(err && err.name === 'AbortError') return; // user backed out of the share sheet — don't also fire a download
    }
    if(window.showSaveFilePicker){
      try{
        const handle = await window.showSaveFilePicker({ suggestedName: filename });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return;
      }catch(err){
        if(err && err.name === 'AbortError') return;
      }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // any real amount of ink in it, re-serializing all of that on every
  // single stroke lift is exactly what made writing feel laggy: a synchronous
  // multi-MB JSON.stringify/parse landing right as you lift the pen for the
  // next stroke. Passing noteId lets the hot path (drawing) skip that cost;
  // omitting it keeps the safe, general behavior for rarer, non-hot-path
  // mutations (trashing/pinning/moving a note from a list, etc.).
  function snapshotNotesExcept(noteId){
    return notes.map(n => (n.id === noteId ? clone(n) : n));
  }
  function checkpoint(noteId){ if(checkpointed) return; undoStack.push(noteId ? snapshotNotesExcept(noteId) : clone(notes)); if(undoStack.length>50) undoStack.shift(); redoStack=[]; checkpointed=true; }
  function commitMutation(){ checkpointed=false; scheduleSave(); }
  function doUndo(){ if(!undoStack.length) return; redoStack.push(clone(notes)); notes=undoStack.pop(); checkpointed=false; scheduleSave(); renderAll(); }
  function doRedo(){ if(!redoStack.length) return; undoStack.push(clone(notes)); notes=redoStack.pop(); checkpointed=false; scheduleSave(); renderAll(); }

  // ---------- markdown ----------
  function renderMarkdown(src){
    let s = escapeHtml(src||'');
    s = s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>')
         .replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>')
         .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')
         .replace(/`(.+?)`/g,'<code>$1</code>')
         .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    const lines = s.split('\n'); let out=[], inList=false, listType=null;
    for(let line of lines){
      const ol=/^\d+\.\s+(.*)$/.exec(line), ul=/^[-*]\s+(.*)$/.exec(line);
      if(ol||ul){ const type = ol?'ol':'ul';
        if(!inList||listType!==type){ if(inList) out.push('</'+listType+'>'); out.push('<'+type+'>'); inList=true; listType=type; }
        out.push('<li>'+(ol?ol[1]:ul[1])+'</li>');
      } else {
        if(inList){ out.push('</'+listType+'>'); inList=false; listType=null; }
        if(line.trim()==='') out.push('');
        else if(/^<h[1-3]>|^<blockquote>/.test(line)) out.push(line);
        else out.push('<p>'+line+'</p>');
      }
    }
    if(inList) out.push('</'+listType+'>');
    return out.join('\n');
  }

  // ---------- filtering ----------
  function matchesQuery(n){
    if(!query.trim()) return true;
    const q = query.toLowerCase();
    return (n.title||'').toLowerCase().includes(q) || (n.body||'').toLowerCase().includes(q) || (n.tags||[]).some(t=>t.toLowerCase().includes(q));
  }
  const activeNotes = () => notes.filter(n => !n.trashed);
  const trashedNotes = () => notes.filter(n => n.trashed).sort((a,b)=>(b.trashedAt||0)-(a.trashedAt||0));
  const folderById = (id) => folders.find(f => f.id === id);

  function currentNoteSet(){
    let list = activeNotes().filter(matchesQuery);
    if(nav === 'gallery') list = list.filter(n => (n.mode||'text') === 'draw');
    if(nav === 'folder') list = list.filter(n => n.folderId === activeFolderId);
    if(nav === 'notes' || nav === 'home'){
      if(tab === 'whiteboard') list = list.filter(n => (n.mode||'text') === 'draw');
      else if(tab === 'notes') list = list.filter(n => (n.mode||'text') !== 'draw');
    }
    return list.slice().sort((a,b)=>b.updatedAt-a.updatedAt);
  }


  // ---------- sidebar ----------
  function renderSidebar(){
    document.querySelectorAll('.sb-item[data-nav]').forEach(el => {
      el.classList.toggle('active', el.dataset.nav === nav);
    });
    document.getElementById('notesCount').textContent = activeNotes().length;

    document.getElementById('foldersSection').innerHTML = folders.map(f => {
      const count = activeNotes().filter(n => n.folderId === f.id).length;
      return `
        <div class="folder-row ${nav==='folder' && activeFolderId===f.id ? 'active':''}" data-open-folder="${f.id}">
          <span class="fdot" style="background:${f.color};"></span>
          <span class="fname">${escapeHtml(f.name)}</span>
          <span class="fcount">${count}</span>
          <button class="f-del" data-del-folder="${f.id}" title="Delete folder">${ICONS.x}</button>
        </div>`;
    }).join('') || `<div style="padding:6px 20px; font-size:12px; color:var(--text-tertiary);">No folders yet</div>`;

    const trashCount = trashedNotes().length;
    document.getElementById('trashLabel').textContent = trashCount ? `Trash (${trashCount})` : 'Trash';
    document.getElementById('trashRow').classList.toggle('active', activeId === '__trash__');

    // These three nav buttons (Home/Notes/Gallery) live in the static shell
    // and are never destroyed/recreated, unlike the folder rows below —
    // using .onclick instead of addEventListener means each call to
    // renderSidebar() (which happens on almost every state change) replaces
    // the handler instead of permanently stacking another one on top of it.
    document.querySelectorAll('[data-nav]').forEach(el => { el.onclick = () => {
      const openNote = activeId && activeId !== '__trash__' ? notes.find(n => n.id === activeId) : null;
      if(openNote && isBlankNote(openNote)) notes = notes.filter(n => n.id !== openNote.id);
      nav = el.dataset.nav; activeFolderId = null; tab = 'all'; activeId = null; mobileShowingMain = false;
      renderAll();
    }; });
    document.querySelectorAll('[data-open-folder]').forEach(el => el.addEventListener('click', (e) => {
      if(e.target.closest('[data-del-folder]')) return;
      nav = 'folder'; activeFolderId = el.dataset.openFolder; activeId = null; mobileShowingMain = true;
      renderAll();
    }));
    document.querySelectorAll('[data-del-folder]').forEach(el => el.addEventListener('click', (e) => {
      e.stopPropagation();
      const fid = el.dataset.delFolder;
      if(!confirm('Delete this folder? Notes inside move back to Unfiled.')) return;
      folders = folders.filter(f => f.id !== fid);
      notes.forEach(n => { if(n.folderId === fid) n.folderId = null; });
      if(nav === 'folder' && activeFolderId === fid){ nav = 'notes'; activeFolderId = null; }
      persistFolders(); scheduleSave(); renderAll();
    }));
  }

  // ---------- grid ----------
  function noteThumb(n){
    const folder = folderById(n.folderId);
    const accent = folder ? folder.color : '#3d7fff';
    if((n.mode||'text') === 'draw'){
      if(n.drawing){
        return `<div class="card-thumb"><img src="${n.drawing}" alt="" /></div>`;
      }
      const bgColor = getPaper(n).paperColor;
      return `<div class="card-thumb" style="background:${bgColor};"><div class="draw-empty">${ICONS.pen}</div></div>`;
    }
    const bodyPreview = (n.body||'').trim();
    const accentTint = hexToRgba(accent, 0.5);
    return `<div class="card-thumb paper-thumb">
      <div class="paper-cover">
        <span class="paper-spine" style="background:${accentTint};"></span>
        <div class="paper-body">
          ${bodyPreview ? `<div class="pp-body">${escapeHtml(bodyPreview)}</div>` : `<div class="pp-lines"><i></i><i></i><i></i><i></i><i></i></div>`}
        </div>
      </div>
    </div>`;
  }


  function noteCard(n){
    const folder = folderById(n.folderId);
    const title = n.title && n.title.trim() ? escapeHtml(n.title) : 'Untitled';
    return `<div class="note-card" data-open="${n.id}">
      ${noteThumb(n)}

  }

  function gridTitle(){
    if(nav === 'home') return 'Unfiled';
    if(nav === 'gallery') return 'Gallery';

    return 'Notes';
  }

  function setHeader(title, show){
    const hdr = document.getElementById('appHeader');
    const t = document.getElementById('hdrTitle');
    if(t) t.textContent = title;
    if(hdr) hdr.classList.toggle('hidden', !show);
  }

  function renderGrid(){
    const list = currentNoteSet();
    const showTabs = nav === 'home' || nav === 'notes';
    setHeader(gridTitle(), true);

    mainEl.innerHTML = `
      <button class="mobile-back" id="backBtn">${ICONS.back}Menu</button>
      <div class="grid-scroll"><div class="grid-wrap">
        ${showTabs ? `
        <div class="tab-row">
          <button class="tab-btn ${tab==='all'?'active':''}" data-tab="all">All</button>
          <button class="tab-btn ${tab==='whiteboard'?'active':''}" data-tab="whiteboard">Whiteboard</button>
          <button class="tab-btn ${tab==='notes'?'active':''}" data-tab="notes">Notes</button>
        </div>` : `<div style="height:6px;"></div>`}
        ${list.length ? `<div class="note-grid">
          <div class="note-card create-card" id="newNoteBtn">
            <div class="card-thumb create-thumb"><span class="create-plus">${ICONS.plus}</span></div>
            <div class="card-meta"><div class="card-title">Create</div></div>
          </div>
          ${list.map(noteCard).join('')}
        </div>` : renderEmptyGrid()}
      </div></div>
    `;
    mainEl.classList.toggle('show-mobile', mobileShowingMain);


    const backBtn = document.getElementById('backBtn');
    if(backBtn) backBtn.addEventListener('click', () => { mobileShowingMain = false; renderAll(); });
    const newBtn = document.getElementById('newNoteBtn');
    if(newBtn) newBtn.addEventListener('click', () => createNote(nav === 'folder' ? activeFolderId : null));

    mainEl.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; renderGrid(); }));
    mainEl.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', (e) => {
      if(e.target.closest('[data-quick-del]')) return;
      activeId = el.dataset.open; mobileShowingMain = true; renderAll();
    }));
    mainEl.querySelectorAll('[data-quick-del]').forEach(el => el.addEventListener('click', (e) => {
      e.stopPropagation();
      const n = notes.find(x => x.id === el.dataset.quickDel);
      if(!n) return;
      checkpoint(); n.trashed = true; n.trashedAt = Date.now(); n.pinned = false;
      commitMutation(); renderAll();
    }));
  }

  function renderEmptyGrid(){
    if(query.trim()) return `<div class="empty-state"><span class="big">No matches</span>Try a different search term.</div>`;
    const label = nav === 'gallery' ? 'drawings' : 'notes';
    return `<div class="empty-state">${ICONS.image}<span class="big">Nothing here yet</span>Create your first ${label==='drawings' ? 'drawing' : 'note'} to get started.<br><button id="emptyNewBtn">New note</button></div>`;
  }

  // ---------- main router ----------
  function renderMain(){
    if(activeId === '__trash__'){ renderTrashView(); return; }
    if(!activeId){ renderGrid(); const eb = document.getElementById('emptyNewBtn'); if(eb) eb.addEventListener('click', () => createNote(nav==='folder'?activeFolderId:null)); return; }
    const note = notes.find(n => n.id === activeId && !n.trashed);
    if(!note){ activeId = null; renderGrid(); return; }
    setHeader('', false);
    renderPage(note);
  }


  function renderTrashView(){
    const list = trashedNotes();
    setHeader('Trash', true);
    mainEl.innerHTML = `
      <button class="mobile-back" id="backBtn">${ICONS.back}Menu</button>
      <div class="grid-scroll"><div class="grid-wrap" style="max-width:640px;">
        ${list.length ? `<div class="trash-banner">Items in trash stay until you delete them forever.</div>` : ''}

        ${list.length ? list.map(n => `
          <div class="trash-list-row">
            <span class="p-icon">${n.icon||'📄'}</span>
            <span class="p-title">${n.title && n.title.trim() ? escapeHtml(n.title) : 'Untitled'}</span>
            <span class="meta">trashed ${fmtDate(n.trashedAt)}</span>
            <button data-restore="${n.id}">Restore</button>
            <button class="danger" data-forget="${n.id}">Delete forever</button>
          </div>`).join('') : `<div style="color:var(--text-secondary); font-size:13.5px;">Trash is empty.</div>`}
      </div></div>
    `;
    mainEl.classList.toggle('show-mobile', mobileShowingMain);
    const back = document.getElementById('backBtn');
    if(back) back.addEventListener('click', () => { mobileShowingMain = false; renderAll(); });
    mainEl.querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', () => {
      checkpoint();
      const n = notes.find(x => x.id === b.dataset.restore);
      n.trashed = false; n.trashedAt = null;
      commitMutation(); renderAll();
    }));
    mainEl.querySelectorAll('[data-forget]').forEach(b => b.addEventListener('click', () => {
      if(!confirm("Permanently delete this note? This can't be undone.")) return;
      notes = notes.filter(x => x.id !== b.dataset.forget);
      scheduleSave(); renderAll();
    }));
  }

  // ---------- editor ----------
  let folderPickerOpen = false;

    mainEl.innerHTML = `

        <div class="topbar-left">
          <button class="close-editor" id="closeEditorBtn">${ICONS.back}All Notes</button>
        </div>
        <div class="topbar-right">

          <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)" ${undoStack.length?'':'disabled'}>${ICONS.undo}</button>

          <button class="icon-btn ${note.pinned?'active-toggle':''}" id="favBtn" title="${note.pinned?'Remove from favorites':'Add to favorites'}" style="color:${note.pinned?'var(--star)':''}">${ICONS.star(note.pinned)}</button>

  // The Template sheet: pick a page template, paper colour, line colour and

  // snapshot taken when the sheet opened.

    return `<div class="tpl-card ${paper.template === tpl.id ? 'selected' : ''}" data-tpl="${tpl.id}">

      <div class="tpl-name">${tpl.name}</div>
    </div>`;
  }

  }

  let canvasApi = null;
  function setupCanvas(note){
    const canvas = document.getElementById('drawCanvas');
    if(!canvas) return;
    const predCanvas = document.getElementById('drawCanvasPredictive');
    const wrap = document.getElementById('canvasWrapEl');
    const scrollEl = document.getElementById('canvasScroll');
    const ratio = window.devicePixelRatio || 1;
    let cssH = note.canvasHeight || DEFAULT_CANVAS_HEIGHT;

    function sizeCanvasTo(newCssH, preserveOldCssH){
      const cssW = wrap.clientWidth;
      wrap.style.height = newCssH + 'px';
      canvas.width = cssW * ratio; canvas.height = newCssH * ratio;
      canvas.style.height = newCssH + 'px';
      const ctx2 = canvas.getContext('2d');
      ctx2.scale(ratio, ratio); ctx2.lineCap = 'round'; ctx2.lineJoin = 'round';
      if(note.drawing){
        const img = new Image();
        img.onload = () => ctx2.drawImage(img, 0, 0, cssW, preserveOldCssH || newCssH);
        img.src = note.drawing;
      }
      // Keep the predictive overlay canvas pixel-for-pixel aligned with the
      // main canvas so a predicted stroke lines up exactly with the real one.
      if(predCanvas){
        predCanvas.width = cssW * ratio; predCanvas.height = newCssH * ratio;
        predCanvas.style.height = newCssH + 'px';
        const pctx = predCanvas.getContext('2d');
        pctx.scale(ratio, ratio); pctx.lineCap = 'round'; pctx.lineJoin = 'round';
      }
      cssH = newCssH;
      note.canvasHeight = newCssH;
      renderPageSeams(wrap, newCssH);
      return ctx2;
    }

    let ctx = sizeCanvasTo(cssH, cssH);
    const predCtx = predCanvas ? predCanvas.getContext('2d') : null;
    function clearPredictive(){
      if(!predCtx) return;
      predCtx.clearRect(0, 0, predCanvas.width, predCanvas.height);
    }

    // ----- Lasso: lift a region of ink off the page, drag it, drop it -----
    // The page is a raster canvas, so a selection is literally a cut-out
    // bitmap: the chosen region is copied to its own canvas, erased from the
    // page, and drawn live on the overlay until it's dropped again.
    let lassoPath = [];         // CSS-px points of the selection outline
    let lassoSel = null;        // { canvas, x, y, w, h, path }
    let lassoOffset = { x: 0, y: 0 };
    let lassoDragging = false, lassoDragFrom = null, lassoDrawing = false;

    function lassoActive(){ return !drawState.erasing && drawState.tool === 'lasso'; }
    function pathFor(points, ctx2){
      ctx2.beginPath();
      points.forEach((pt, i) => i ? ctx2.lineTo(pt.x, pt.y) : ctx2.moveTo(pt.x, pt.y));
      ctx2.closePath();
    }
    function pointInPath(points, x, y){
      let inside = false;
      for(let i = 0, j = points.length - 1; i < points.length; j = i++){
        const a = points[i], b = points[j];
        if(((a.y > y) !== (b.y > y)) && (x < (b.x - a.x) * (y - a.y) / ((b.y - a.y) || 1e-6) + a.x)) inside = !inside;
      }
      return inside;
    }
    function renderLasso(){
      if(!predCtx) return;
      clearPredictive();
      if(predCanvas) predCanvas.style.opacity = '1';
      predCtx.save();
      if(lassoSel){
        predCtx.drawImage(lassoSel.canvas, lassoSel.x + lassoOffset.x, lassoSel.y + lassoOffset.y, lassoSel.w, lassoSel.h);
      }
      const outline = lassoSel ? lassoSel.path.map(pt => ({ x: pt.x + lassoOffset.x, y: pt.y + lassoOffset.y })) : lassoPath;
      if(outline.length > 1){
        predCtx.setLineDash([6, 5]);
        predCtx.lineWidth = 1.5;
        predCtx.strokeStyle = 'rgba(90,160,255,0.95)';
        pathFor(outline, predCtx);
        predCtx.stroke();
      }
      predCtx.restore();
    }
    function lassoDropSelection(){
      if(!lassoSel) return;
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.drawImage(lassoSel.canvas, lassoSel.x + lassoOffset.x, lassoSel.y + lassoOffset.y, lassoSel.w, lassoSel.h);
      ctx.restore();
      lassoSel = null; lassoOffset = { x: 0, y: 0 }; lassoPath = [];
      clearPredictive();
      saveDrawing();
    }
    function lassoDeleteSelection(){
      if(!lassoSel) return;
      lassoSel = null; lassoOffset = { x: 0, y: 0 }; lassoPath = [];
      clearPredictive();
      saveDrawing();
    }
    function lassoLift(){
      let pts = lassoPath;
      if(drawState.lasso.mode === 'boxed' && pts.length > 1){
        const a = pts[0], b = pts[pts.length - 1];
        pts = [{x:a.x,y:a.y},{x:b.x,y:a.y},{x:b.x,y:b.y},{x:a.x,y:b.y}];
      }
      if(pts.length < 3){ lassoPath = []; clearPredictive(); return; }
      const xs = pts.map(pt => pt.x), ys = pts.map(pt => pt.y);
      const x = Math.max(0, Math.min(...xs) - 2), y = Math.max(0, Math.min(...ys) - 2);
      const w = Math.min(wrap.clientWidth - x, Math.max(...xs) - x + 4);
      const h = Math.min(cssH - y, Math.max(...ys) - y + 4);
      if(w < 4 || h < 4){ lassoPath = []; clearPredictive(); return; }
      const cut = document.createElement('canvas');
      cut.width = Math.ceil(w * ratio); cut.height = Math.ceil(h * ratio);
      const cctx = cut.getContext('2d');
      cctx.scale(ratio, ratio);
      cctx.translate(-x, -y);
      pathFor(pts, cctx);
      cctx.clip();
      cctx.drawImage(canvas, 0, 0, wrap.clientWidth, cssH);
      // Erase the lifted region from the page itself.
      ctx.save();
      pathFor(pts, ctx);
      ctx.clip();
      ctx.clearRect(x, y, w, h);
      ctx.restore();
      lassoSel = { canvas: cut, x, y, w, h, path: pts.map(pt => ({ x: pt.x, y: pt.y })) };
      lassoPath = [];
      lassoOffset = { x: 0, y: 0 };
      renderLasso();
      saveDrawing();
    }

    // Imported reference material (a past paper PDF/image you're working
    // on top of) lives on its own canvas, entirely separate from the ink
    // above it — via a negative z-index so it sits behind the ink canvas
    // but in front of the page's own dot/line background. That separation
    // matters: erasing or clearing ink never touches it, and note.drawing
    // (the ink layer's own saved PNG) stays just the ink, nothing baked
    // in — the two are only composited together at export time.
    const bgCanvas = document.getElementById('drawCanvasBg');
    const bgCtx = bgCanvas ? bgCanvas.getContext('2d') : null;
    const bgImageCache = new Map(); // src -> decoded Image, so repeated resizes don't re-decode every page every time
    function loadBgImage(src){
      if(bgImageCache.has(src)) return Promise.resolve(bgImageCache.get(src));
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => { bgImageCache.set(src, img); resolve(img); };
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }
    function bgContentHeight(cssW){
      return (note.bgPages || []).reduce((sum, p) => sum + (p.naturalH / p.naturalW) * cssW, 0);
    }
    async function renderBgLayer(cssWNow, cssHNow){
      if(!bgCanvas || !bgCtx) return;
      bgCanvas.width = cssWNow * ratio; bgCanvas.height = cssHNow * ratio;
      bgCanvas.style.height = cssHNow + 'px';
      bgCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
      bgCtx.clearRect(0, 0, cssWNow, cssHNow);
      let y = 0;
      for(const page of (note.bgPages || [])){
        const h = (page.naturalH / page.naturalW) * cssWNow;
        const img = await loadBgImage(page.src);
        if(img) bgCtx.drawImage(img, 0, y, cssWNow, h);
        y += h;
      }
    }
    renderBgLayer(wrap.clientWidth, cssH);

    // Importing a PDF/image (a past paper, a worksheet, etc.) turns each
    // page into a background reference page you can draw on top of — the
    // canvas grows to fit if the imported content is taller than what's
    // there already.
    function fileToDataUrl(file){
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    function naturalSizeOf(src){
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({ w: img.naturalWidth || 1, h: img.naturalHeight || 1 });
        img.onerror = () => resolve({ w: 1, h: 1 });
        img.src = src;
      });
    }
    let pdfJsLoadPromise = null;
    function ensurePdfJsLoaded(){
      if(window.pdfjsLib) return Promise.resolve();
      if(pdfJsLoadPromise) return pdfJsLoadPromise;
      pdfJsLoadPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        script.onload = () => {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          resolve();
        };
        script.onerror = () => reject(new Error('Could not load PDF support'));
        document.head.appendChild(script);
      });
      return pdfJsLoadPromise;
    }
    async function importFileAsBackground(file){
      const cssW = wrap.clientWidth;
      const newPages = [];
      try{
        if(file.type === 'application/pdf'){
          await ensurePdfJsLoaded();
          const buf = await file.arrayBuffer();
          const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
          for(let i = 1; i <= pdf.numPages; i++){
            const page = await pdf.getPage(i);
            const viewport = page.getViewport({ scale: 2 }); // 2x for crisp text/lines when drawn on top
            const off = document.createElement('canvas');
            off.width = Math.round(viewport.width); off.height = Math.round(viewport.height);
            await page.render({ canvasContext: off.getContext('2d'), viewport }).promise;
            newPages.push({ src: off.toDataURL('image/png'), naturalW: off.width, naturalH: off.height });
          }
        } else if(file.type.startsWith('image/')){
          const src = await fileToDataUrl(file);
          const dims = await naturalSizeOf(src);
          newPages.push({ src, naturalW: dims.w, naturalH: dims.h });
        } else {
          alert('Please choose a PDF or image file.');
          return;
        }
      }catch(err){
        console.error('Import failed', err);
        alert('Could not import that file.');
        return;
      }

      checkpoint();
      note.bgPages = (note.bgPages || []).concat(newPages);
      const neededH = Math.max(cssH, bgContentHeight(cssW), DEFAULT_CANVAS_HEIGHT);
      if(neededH !== cssH){
        resizeLiveCanvas(cssW, neededH); // already re-renders the bg layer with the updated pages
      } else {
        await renderBgLayer(cssW, cssH);
      }
      note.updatedAt = Date.now();
      commitMutation();
    }
    const importBtn = document.getElementById('importBtn');
    const importFileInput = document.getElementById('importFileInput');
    if(importBtn && importFileInput){
      importBtn.addEventListener('click', (e) => { e.stopPropagation(); importFileInput.click(); });
      importFileInput.addEventListener('click', (e) => e.stopPropagation());
      importFileInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        importFileInput.value = '';
        if(file) await importFileAsBackground(file);
      });
    }

    // Copies whatever's CURRENTLY on the canvas into a same-size offscreen
    // canvas, synchronously — used whenever the canvas needs resizing
    // mid-session (growing taller while drawing, or a width resync), so it
    // can be redrawn from exactly what's live right now. That distinction
    // matters: reloading from the last *saved* image (note.drawing, like
    // the initial load above does) would silently drop anything drawn
    // since that save — most importantly the stroke currently in progress,
    // since both of these resizes can happen mid-stroke by design — and
    // doing it via an async Image/data-URL round trip (as opposed to a
    // synchronous canvas-to-canvas drawImage) leaves a brief window where
    // ink stamped right after the resize gets overwritten the instant the
    // async reload finally finishes.
    function snapshotLivePixels(){
      const temp = document.createElement('canvas');
      temp.width = canvas.width; temp.height = canvas.height;
      temp.getContext('2d').drawImage(canvas, 0, 0);
      return temp;
    }
    function resizeLiveCanvas(newCssW, newCssH){
      const temp = snapshotLivePixels();
      wrap.style.height = newCssH + 'px';
      canvas.width = newCssW * ratio; canvas.height = newCssH * ratio;
      canvas.style.height = newCssH + 'px';
      ctx = canvas.getContext('2d');
      ctx.scale(ratio, ratio); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.drawImage(temp, 0, 0, temp.width, temp.height, 0, 0, newCssW, newCssH);
      if(predCanvas){
        predCanvas.width = newCssW * ratio; predCanvas.height = newCssH * ratio;
        predCanvas.style.height = newCssH + 'px';
        const pctx2 = predCanvas.getContext('2d');
        pctx2.scale(ratio, ratio); pctx2.lineCap = 'round'; pctx2.lineJoin = 'round';
      }
      cssH = newCssH;
      lastCssW = newCssW;
      note.canvasHeight = newCssH;
      renderPageSeams(wrap, newCssH);
      renderBgLayer(newCssW, newCssH);
    }

    // The canvas's internal pixel grid is only recomputed when we
    // explicitly resize it — nothing was re-syncing it if the canvas's
    // on-screen *width* changed afterward (window/orientation change, the
    // sidebar toggling, or launching as an installed PWA with different
    // chrome than the Safari tab it was last sized in). When that
    // happened, CSS kept stretching the canvas's display size to fit while
    // its internal coordinate space stayed sized for the old width — so
    // stylus input (measured in current on-screen CSS pixels) landed
    // increasingly wrong the further from the left edge you wrote. Watch
    // for width changes and re-sync, preserving whatever's currently drawn
    // (not just the last-saved version) so nothing is lost mid-stroke.
    let lastCssW = wrap.clientWidth;
    function resyncWidthIfChanged(){
      const newCssW = wrap.clientWidth;
      if(Math.abs(newCssW - lastCssW) < 1) return;
      resizeLiveCanvas(newCssW, cssH);
    }
    if(currentCanvasResizeHandler){
      window.removeEventListener('resize', currentCanvasResizeHandler);
      window.removeEventListener('orientationchange', currentCanvasResizeHandler);
    }
    currentCanvasResizeHandler = resyncWidthIfChanged;
    window.addEventListener('resize', resyncWidthIfChanged);
    window.addEventListener('orientationchange', resyncWidthIfChanged);
    // Also catch it the instant you touch down to draw — cheaper than a
    // resize listener catching everything (e.g. a PWA's chrome settling a
    // beat after launch) and guarantees the very first stroke is correct.
    canvas.addEventListener('pointerdown', resyncWidthIfChanged, { capture: true });

    let growing = false;
    function growIfNear(edgeY){
      if(growing) return;
      if(cssH - edgeY < GROW_MARGIN){
        growing = true;
        resizeLiveCanvas(wrap.clientWidth, cssH + GROW_STEP);
        // resizeLiveCanvas() recreates the 2D context (canvas.width
        // reassignment resets it), which silently resets fillStyle/
        // compositeOperation to their defaults. Restore whatever operation
        // was actually in progress so an eraser stroke that triggers a
        // mid-stroke grow doesn't start painting instead of erasing for
        // the rest of the current batch of points.
        ctx.globalCompositeOperation = strokeIsErasing ? 'destination-out' : 'source-over';
        ctx.fillStyle = strokeIsErasing ? '#000' : drawState.color;
        commitMutation();
        setTimeout(() => { growing = false; }, 30);
      }
    }

    let drawing = false, lastX = 0, lastY = 0;
    let smoothX = 0, smoothY = 0; // running exponential-average position, tames finger jitter
    function pos(e){ const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

    // Stamping filled circles along the path (instead of stroking a fixed-
    // width line) is what lets the line's width flow continuously with
    // pressure/velocity/taper rather than jumping between fixed-width
    // segments — the same core trick real drawing apps use for a tapered,
    // organic pen line instead of a uniform ruled one.
    // Deterministic pseudo-random so a live (re-rendered every frame)
    // pencil stroke keeps exactly the same grain instead of shimmering.
    function hashNoise(x, y, k){
      const v = Math.sin(x * 12.9898 + y * 78.233 + k * 37.719) * 43758.5453;
      return v - Math.floor(v);
    }
    function stampCircle(targetCtx, x, y, r){
      if(drawState.tool === 'pencil' && !strokeIsErasing){
        const rad = Math.max(0.4, r);
        const prevAlpha = targetCtx.globalAlpha;
        for(let i = 0; i < 3; i++){
          const a = hashNoise(x, y, i) * Math.PI * 2;
          const d = hashNoise(y, x, i + 5) * rad * 0.75;
          targetCtx.globalAlpha = prevAlpha * (0.3 + 0.45 * hashNoise(x + i, y - i, 9));
          targetCtx.beginPath();
          targetCtx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, rad * (0.55 + 0.35 * hashNoise(x, y, i + 2)), 0, Math.PI * 2);
          targetCtx.fill();
        }
        targetCtx.globalAlpha = prevAlpha;
        return;
      }
      targetCtx.beginPath();
      targetCtx.arc(x, y, Math.max(0.4, r), 0, Math.PI * 2);
      targetCtx.fill();
    }
    // Fills a tapered ribbon between two points by sampling many circles
    // along the segment — substep density scales with distance so fast
    // strokes (fewer, farther-apart real samples) still render continuous
    // ink instead of visible dots.
    function stampSegment(targetCtx, x0, y0, r0, x1, y1, r1, cumStart){
      const dist = Math.hypot(x1 - x0, y1 - y0);
      const steps = Math.max(1, Math.ceil(dist / 1.4));
      for(let i = 1; i <= steps; i++){
        const t = i / steps;
        if(cumStart != null && !dashOn(cumStart + dist * t)) continue;
        stampCircle(targetCtx, x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, r0 + (r1 - r0) * t);
      }
    }

    // Real ink (and Notability's pen) tapers in from a point when you touch
    // down, tapers back out when you lift, and runs thinner the faster you
    // move — not just pressure-driven. START_TAPER/END_TAPER are measured
    // in px of travel, not point-count, so they behave the same regardless
    // of sampling density.
    const START_TAPER_DIST = 14;
    const END_TAPER_DIST = 16;
    // How much of the tail (in px of travel) we keep "live" — redrawable on
    // the overlay — rather than baking straight to the real canvas. Needs
    // to comfortably exceed END_TAPER_DIST so the true lift-off taper can
    // still reshape it once the stroke actually ends.
    const TAIL_WINDOW_DIST = END_TAPER_DIST * 3;

    // Only the pen behaves like real tapered ink. A marker lays down a bold,
    // even stroke (a touch of pressure response, no taper), and a
    // highlighter is dead flat and constant-width like a real chisel tip.
    // Sensitivity dials how much of the raw pen pressure actually reaches
    // the stroke width: 0% is a dead-even line, 100% is fully expressive.
    function effPressure(pressure){
      const sens = (tset().sensitivity == null ? 50 : tset().sensitivity) / 100;
      return Math.max(0.05, Math.min(1, 0.5 + (pressure - 0.5) * (sens * 2)));
    }
    function baseRadiusFor(rawPressure, dist, cum){
      const maxD = drawState.penSize;
      if(drawState.tool === 'highlighter') return maxD / 2;
      const pressure = effPressure(rawPressure);
      if(drawState.tool === 'marker'){
        const p = Math.max(0.75, Math.min(1, pressure + 0.35));
        return (maxD * p) / 2;
      }
      if(drawState.tool === 'pencil'){
        // Graphite: no taper, width tracks pressure, grain comes from the
        // scatter in stampCircle.
        return (maxD * (0.55 + 0.45 * pressure)) / 2;
      }
      // Tip: a fine tip keeps a thin floor and a sharper lead-in, a fat tip
      // starts closer to full width.
      const tip = (tset().tip == null ? 50 : tset().tip) / 100;
      const pressureR = Math.max(maxD * (0.08 + 0.32 * tip), pressure * maxD) / 2;
      const speedScale = Math.max(0.55, 1 - Math.min(dist, 20) / 20 * 0.45);
      const startT = Math.min(1, cum / START_TAPER_DIST);
      const startTaper = 0.28 + 0.72 * startT;
      return pressureR * speedScale * startTaper;
    }
    function endTaperedRadius(r, distFromEnd){
      if(drawState.tool !== 'pen') return r;
      if(strokeStraight) return r;
      const t = Math.min(1, Math.max(0, distFromEnd) / END_TAPER_DIST);
      return r * (0.18 + 0.82 * t);
    }

    // strokePts holds every real (post-jitter-smoothing) point of the
    // in-progress pen stroke: {x, y, r, cum}. Points older than the tail
    // window get baked permanently onto the real canvas as soon as they're
    // safely out of range of the eventual lift-off taper; bakedCount tracks
    // how many are already committed. Everything from bakedCount onward is
    // still "live" and redrawn from scratch each frame on the transparent
    // overlay canvas, so it can still be reshaped right up until the pen
    // actually lifts — that's what lets the tail taper correctly instead of
    // permanently baking-in a guess that turns out wrong.
    let strokePts = [];
    let bakedCount = 0;
    let strokeIsErasing = false;
    // A highlighter stroke has to be laid down as ONE translucent layer,
    // otherwise every overlapping stamp along the same stroke would stack up
    // and the line would look blotchy where you moved slowly. So the whole
    // stroke is painted opaque on the overlay canvas (shown at highlighter
    // opacity via CSS) and only flattened onto the real page once, at the
    // chosen alpha, when the pen lifts.
    let strokeIsHighlighter = false;
    let strokeAlpha = 1;      // ink opacity from the tool's Concentration
    let strokeStraight = false; // "Draw in Straight Line" is on for this stroke
    let strokeDash = 'solid';
    function currentAlpha(){
      const c = tset().concentration;
      return Math.max(0.05, Math.min(1, (c == null ? 100 : c) / 100));
    }
    // Anything that isn't fully opaque has to be laid down as one flat layer
    // on the overlay and flattened once on lift-off, otherwise overlapping
    // stamps inside a single stroke stack up and look blotchy.
    function toolIsFlattened(){
      return drawState.tool === 'highlighter' || drawState.tool === 'pencil' || currentAlpha() < 0.999;
    }
    function setPredictiveOpacity(){
      if(predCanvas) predCanvas.style.opacity = strokeIsHighlighter ? String(strokeAlpha) : '1';
    }
    // Dotted / dashed highlighter: skip the gaps as we walk along the path.
    function dashOn(cum){
      if(strokeDash === 'solid') return true;
      const unit = Math.max(6, drawState.penSize * (strokeDash === 'dotted' ? 0.9 : 1.8));
      const period = strokeDash === 'dotted' ? unit * 2 : unit * 2.2;
      const on = strokeDash === 'dotted' ? unit * 0.55 : unit * 1.2;
      return (cum % period) < on;
    }

    function bakeUpTo(uptoIdx){
      if(uptoIdx <= bakedCount) return;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = drawState.color;
      for(let i = bakedCount; i < uptoIdx; i++){
        const a = strokePts[i - 1], b = strokePts[i];
        stampSegment(ctx, a.x, a.y, a.r, b.x, b.y, b.r);
      }
      bakedCount = uptoIdx;
    }

    // Redraws the still-live tail (from the last baked point to the current
    // end, optionally extended by a speculative predicted point) onto the
    // overlay canvas with the true end-taper applied. Cheap and safe to
    // call every frame since it only ever touches the small tail window.
    function renderLiveTail(extraPt){
      if(!predCtx) return;
      clearPredictive();
      if(strokePts.length < 1) return;
      const lastReal = strokePts[strokePts.length - 1];
      const total = lastReal.cum + (extraPt ? Math.hypot(extraPt.x - lastReal.x, extraPt.y - lastReal.y) : 0);
      let pts = strokePts.slice(Math.max(0, bakedCount - 1));
      let all = extraPt ? pts.concat([{ x: extraPt.x, y: extraPt.y, r: extraPt.r, cum: total }]) : pts;
      if(strokeStraight && strokePts.length > 1){
        // Straight-line mode: ignore the wobble entirely and draw a clean
        // ruler line from where the stroke started to where it is now.
        const a0 = strokePts[0], a1 = all[all.length - 1];
        const len = Math.hypot(a1.x - a0.x, a1.y - a0.y);
        all = [{ x: a0.x, y: a0.y, r: a0.r, cum: 0 }, { x: a1.x, y: a1.y, r: a1.r, cum: len }];
      }
      predCtx.globalCompositeOperation = 'source-over';
      predCtx.fillStyle = drawState.color;
      if(all.length === 1){
        const only = all[0];
        stampCircle(predCtx, only.x, only.y, endTaperedRadius(only.r, total - only.cum));
        return;
      }
      for(let i = 1; i < all.length; i++){
        const a = all[i - 1], b = all[i];
        const ra = endTaperedRadius(a.r, total - a.cum);
        const rb = endTaperedRadius(b.r, total - b.cum);
        stampSegment(predCtx, a.x, a.y, ra, b.x, b.y, rb, strokeDash === 'solid' ? null : a.cum);
      }
    }

    const eraserCursor = document.getElementById('eraserCursor');
    updateEraserCursorSize();
    function moveEraserCursor(x, y){
      if(!eraserCursor || !drawState.erasing) return;
      eraserCursor.style.left = x + 'px';
      eraserCursor.style.top = y + 'px';
    }
    function showEraserCursor(){ if(eraserCursor && drawState.erasing) eraserCursor.classList.add('show'); }
    function hideEraserCursor(){ if(eraserCursor) eraserCursor.classList.remove('show'); }

    function saveDrawing(){
      checkpoint(note.id);
      note.drawing = canvas.toDataURL('image/png');
      note.updatedAt = Date.now();
      commitMutation();
    }

    // Gesture routing: pen/stylus and mouse always draw. A bare finger touch
    // scrolls by default (one finger is enough — no need to bring in a second
    // finger just to scroll), unless "Draw with finger" is toggled on, in
    // which case a single finger draws instead and two fingers scroll.
    let activePointers = new Map(); // pointerId -> {x, y}
    let gestureMode = 'idle'; // 'draw' | 'scroll' | 'idle'
    let scrollStartY = 0, scrollStartTop = 0;
    // The pointer that actually owns the current draw stroke, if any. Once
    // set, any *other* pointer touching down or moving (a resting palm, the
    // side of your hand while writing with a stylus) is ignored outright
    // instead of being allowed to hijack the shared gesture state into
    // "scroll" mid-stroke — which is what silently truncated/dropped
    // strokes whenever a palm grazed the screen while writing.
    let primaryPointerId = null, primaryPointerType = null;

    function avgY(){
      const pts = Array.from(activePointers.values());
      return pts.reduce((s, p) => s + p.y, 0) / pts.length;
    }

    // A resting palm/hand reports a much larger touch contact area than a
    // fingertip, via PointerEvent.width/height on touchscreens that support
    // it. But contact size alone isn't reliable enough to filter on for
    // *every* touch — plenty of ordinary fingers report sizes that would
    // trip a blanket threshold, which is exactly what broke plain one-
    // finger scrolling. So this only kicks in when a stylus has genuinely
    // been active moments ago: that's the actual scenario that mattered
    // (a resting hand while writing with a pen), without touching normal
    // finger-only scrolling at all.
    const PALM_CONTACT_PX = 55;
    const PEN_RECENCY_MS = 1200;
    let lastPenActivityAt = 0;
    function noteRecentPen(e){ if(e.pointerType === 'pen') lastPenActivityAt = Date.now(); }
    function looksLikePalm(e){
      if(e.pointerType !== 'touch') return false;
      const big = (e.width || 0) > PALM_CONTACT_PX || (e.height || 0) > PALM_CONTACT_PX;
      return big && (Date.now() - lastPenActivityAt) < PEN_RECENCY_MS;
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      noteRecentPen(e);

      // If a text field (like the title) still has keyboard focus when you
      // start writing, iPadOS can sometimes read a quick pen stroke as a
      // Scribble system gesture aimed at that field instead of as ink —
      // which would show up exactly as "wrote a letter, nothing appeared."
      // Force focus away from any lingering text field the instant the
      // stylus touches the canvas.
      if(document.activeElement && document.activeElement !== document.body && typeof document.activeElement.blur === 'function'){
        document.activeElement.blur();
      }

      if(looksLikePalm(e)) return;

      if(gestureMode === 'draw' && drawing && primaryPointerType !== 'touch' && e.pointerType === 'touch'){
        // Actively drawing with a pen or mouse — a touch landing now can
        // only be incidental (palm, side of hand), never an intentional
        // second input, so ignore it completely rather than letting it
        // cancel the stroke.
        return;
      }

      clearPredictive();
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      const isTouch = e.pointerType === 'touch';
      const shouldScroll = isTouch
        ? (drawState.fingerDraw ? activePointers.size >= 2 : true)
        : false;

      if(shouldScroll){
        // Finger touch (in default mode), or a second finger, or Scroll mode
        // explicitly on — abandon any in-progress stroke and scroll instead.
        drawing = false;
        gestureMode = 'scroll';
        primaryPointerId = null; primaryPointerType = null;
        scrollStartY = avgY();
        scrollStartTop = scrollEl.scrollTop;
        hideEraserCursor();
        return;
      }

      gestureMode = 'draw';
      drawing = true;
      primaryPointerId = e.pointerId; primaryPointerType = e.pointerType;
      try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
      const [x, y] = pos(e);
      lastX = x; lastY = y; smoothX = x; smoothY = y;
      moveEraserCursor(x, y);
      showEraserCursor();

      if(lassoActive()){
        if(lassoSel){
          const inside = pointInPath(lassoSel.path.map(pt => ({ x: pt.x + lassoOffset.x, y: pt.y + lassoOffset.y })), x, y);
          if(inside){
            lassoDragging = true; lassoDragFrom = { x, y };
            lassoOffset = { x: lassoOffset.x, y: lassoOffset.y, baseX: lassoOffset.x, baseY: lassoOffset.y };
            return;
          }
          lassoDropSelection();
        }
        lassoDrawing = true;
        lassoPath = [{ x, y }];
        renderLasso();
        return;
      }

      strokeIsErasing = drawState.erasing;
      strokeAlpha = currentAlpha();
      strokeStraight = !strokeIsErasing && drawState.tool === 'highlighter' && !!tset().straightLine;
      strokeDash = (!strokeIsErasing && drawState.tool === 'highlighter') ? (tset().dash || 'solid') : 'solid';
      strokeIsHighlighter = !strokeIsErasing && toolIsFlattened();
      setPredictiveOpacity();
      ctx.globalCompositeOperation = strokeIsErasing ? 'destination-out' : 'source-over';
      ctx.fillStyle = strokeIsErasing ? '#000' : drawState.color;

      if(strokeIsErasing){
        // Eraser stays simple, immediate, and constant-width — painted
        // straight onto the real canvas as you go. Predictable removal
        // matters more here than tapered artistry.
        stampCircle(ctx, x, y, drawState.eraserSize / 2);
        return;
      }

      const pressure = e.pressure && e.pressure > 0 ? e.pressure : 0.5;
      const startR = baseRadiusFor(pressure, 0, 0);
      strokePts = [{ x, y, r: startR, cum: 0 }];
      if(strokeIsHighlighter){
        // Nothing goes onto the real page yet — it all stays live on the
        // overlay until lift-off, then gets flattened once.
        bakedCount = 0;
        renderLiveTail(null);
        return;
      }
      bakedCount = 1;
      // Bake the start point immediately (its own taper is already fully
      // determined and never needs revising) so a tap-and-lift still leaves
      // a mark even before any pointermove fires.
      stampCircle(ctx, x, y, startR);
    });

    canvas.addEventListener('pointermove', (e) => {
      noteRecentPen(e);

      if(gestureMode === 'draw' && drawing && e.pointerId !== primaryPointerId){
        // A non-primary pointer moving while a real stroke is in progress —
        // almost certainly a palm/incidental touch we deliberately ignored
        // on the way down. Never let it feed points into the active stroke.
        return;
      }

      if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if(gestureMode === 'scroll'){
        const delta = scrollStartY - avgY();
        scrollEl.scrollTop = scrollStartTop + delta;
        return;
      }

      const [hx, hy] = pos(e);
      moveEraserCursor(hx, hy);
      if(e.pointerType !== 'touch') showEraserCursor();

      if(gestureMode !== 'draw' || !drawing) return;

      if(lassoActive()){
        const [lx, ly] = pos(e);
        if(lassoDragging && lassoDragFrom){
          lassoOffset = { x: lx - lassoDragFrom.x + (lassoOffset.baseX || 0), y: ly - lassoDragFrom.y + (lassoOffset.baseY || 0) };
          renderLasso();
        } else if(lassoDrawing){
          lassoPath.push({ x: lx, y: ly });
          renderLasso();
        }
        return;
      }

      // A bare finger is a noisier input source than a stylus — a light
      // exponential-moving-average tames the small tremor/jitter without
      // adding noticeable lag. Pen/mouse input is precise enough already,
      // so it goes through untouched (heavy smoothing there would just add
      // lag for no benefit).
      // Stability adds deliberate smoothing on top of the baseline finger
      // jitter filter, so a shaky hand still lays down a clean line.
      const stability = drawState.erasing ? 0 : (tset().stability || 0);
      const jitterAlpha = Math.min(0.9, Math.max(e.pointerType === 'touch' ? 0.55 : 0, stability * 0.15));

      // Use getCoalescedEvents so fast strokes (especially with an Apple
      // Pencil / stylus) don't skip the many sub-frame points the browser
      // has actually recorded — without this, quick strokes look sparse
      // and jagged even though the hardware sampled far more points.
      let events = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
      if(!events.length) events = [e];

      if(strokeIsErasing){
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fillStyle = '#000';
        const r = drawState.eraserSize / 2;
        events.forEach(ev => {
          let [x, y] = pos(ev);
          if(jitterAlpha){
            smoothX = smoothX + (x - smoothX) * (1 - jitterAlpha);
            smoothY = smoothY + (y - smoothY) * (1 - jitterAlpha);
            x = smoothX; y = smoothY;
          }
          stampSegment(ctx, lastX, lastY, r, x, y, r);
          lastX = x; lastY = y;
          growIfNear(y);
        });
        moveEraserCursor(lastX, lastY);
        return;
      }

      events.forEach(ev => {
        let [x, y] = pos(ev);
        if(jitterAlpha){
          smoothX = smoothX + (x - smoothX) * (1 - jitterAlpha);
          smoothY = smoothY + (y - smoothY) * (1 - jitterAlpha);
          x = smoothX; y = smoothY;
        }
        const pressure = ev.pressure && ev.pressure > 0 ? ev.pressure : 0.5;
        const prev = strokePts[strokePts.length - 1];
        const dist = Math.hypot(x - prev.x, y - prev.y);
        const cum = prev.cum + dist;
        strokePts.push({ x, y, r: baseRadiusFor(pressure, dist, cum), cum });
        lastX = x; lastY = y;
        growIfNear(y);
      });

      // Bake everything that's now safely behind the taper window onto the
      // real canvas; keep only the tail live so it can still be reshaped by
      // the true lift-off taper (or more incoming points) later.
      if(!strokeIsHighlighter){
        const total = strokePts[strokePts.length - 1].cum;
        let tailStart = strokePts.length - 1;
        while(tailStart > 0 && total - strokePts[tailStart].cum < TAIL_WINDOW_DIST) tailStart--;
        bakeUpTo(Math.max(bakedCount, tailStart));
      }

      // Predictive tip: the browser's own best guess at where the pen is
      // headed next, layered onto the same live tail so it blends with the
      // real ink's current width instead of a mismatched separate segment.
      // It's redrawn from scratch every move and wiped on lift/scroll, so a
      // wrong guess never leaves a permanent mark — the next real point
      // always continues from the last *committed* point, not the guess.
      let extraPt = null;
      const predicted = e.getPredictedEvents && e.getPredictedEvents();
      if(predicted && predicted.length){
        const [px, py] = pos(predicted[0]);
        extraPt = { x: px, y: py, r: strokePts[strokePts.length - 1].r };
      }
      renderLiveTail(extraPt);
      moveEraserCursor(lastX, lastY);
    });

    function endPointer(e){
      if(gestureMode === 'draw' && drawing && e.pointerId !== primaryPointerId){
        // Lift-off of a pointer we ignored on the way down (palm, etc.) —
        // it never touched the active stroke's state, so it shouldn't end
        // it either. Just let the real drawing pointer keep going.
        return;
      }
      activePointers.delete(e.pointerId);
      hideEraserCursor();
      if(!(gestureMode === 'draw' && drawing && (strokeIsHighlighter || lassoActive()))) clearPredictive();
      if(gestureMode === 'scroll'){
        if(activePointers.size === 0) gestureMode = 'idle';
        return;
      }
      if(gestureMode === 'draw' && drawing){
        drawing = false; gestureMode = 'idle';
        primaryPointerId = null; primaryPointerType = null;
        if(lassoActive()){
          if(lassoDragging){
            lassoOffset = { x: lassoOffset.x, y: lassoOffset.y, baseX: lassoOffset.x, baseY: lassoOffset.y };
            lassoDragging = false; lassoDragFrom = null;
            renderLasso();
          } else if(lassoDrawing){
            lassoDrawing = false;
            lassoLift();
          }
          return;
        }
        if(strokeIsHighlighter){
          // Flatten the whole overlay stroke onto the page in one pass at
          // highlighter opacity, so overlaps within the stroke stay even.
          if(predCanvas && strokePts.length){
            // ctx is always left with ctx.scale(ratio, ratio) applied (set
            // in sizeCanvasTo/resizeLiveCanvas so every other draw call can
            // work in plain CSS-pixel coordinates). canvas.width/height are
            // DEVICE-pixel dimensions (cssW*ratio), though, so passing them
            // straight to drawImage as the destination size — while that
            // ratio scale is still active — scaled the flattened highlighter
            // image by devicePixelRatio a second time. On any HiDPI screen
            // (ratio > 1, i.e. virtually every phone/tablet) that stretched
            // and shifted the highlighter mark away from the actual pen
            // path the moment you lifted the pen. predCanvas is already
            // pixel-for-pixel aligned with canvas in device pixels, so draw
            // it 1:1 with the transform reset rather than going through the
            // CSS-scaled coordinate system at all.
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = strokeAlpha;
            ctx.drawImage(predCanvas, 0, 0);
            ctx.restore();
          }
          strokeIsHighlighter = false;
          setPredictiveOpacity();
          clearPredictive();
          strokePts = []; bakedCount = 0;
          saveDrawing(); growIfNear(lastY);
          return;
        }
        if(!strokeIsErasing && strokePts.length > bakedCount){
          // Now that we know exactly where the stroke really ends, bake the
          // remaining live tail with the true lift-off taper applied.
          const total = strokePts[strokePts.length - 1].cum;
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = drawState.color;
          for(let i = bakedCount; i < strokePts.length; i++){
            const a = strokePts[i - 1], b = strokePts[i];
            const ra = endTaperedRadius(a.r, total - a.cum);
            const rb = endTaperedRadius(b.r, total - b.cum);
            stampSegment(ctx, a.x, a.y, ra, b.x, b.y, rb);
          }
        }
        strokePts = []; bakedCount = 0;
        saveDrawing(); growIfNear(lastY);
      }
    }
    ['pointerup','pointerleave','pointercancel'].forEach(evt => canvas.addEventListener(evt, endPointer));
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());


    // grow the page as you scroll toward the bottom too, not just while drawing —
    // makes it feel like one continuous, endless page instead of a fixed sheet
    scrollEl.addEventListener('scroll', () => {
      growIfNear(scrollEl.scrollTop + scrollEl.clientHeight);
    }, { passive: true });

    canvasApi = { deleteSelection: lassoDeleteSelection, dropSelection: lassoDropSelection };

    // resume scroll position near where they left off (bottom of drawn content) on first open
    if(note.drawing) requestAnimationFrame(() => { scrollEl.scrollTop = 0; });
  }

  function renderPageSeams(wrap, totalHeight){
    wrap.querySelectorAll('.page-seam').forEach(el => el.remove());
    const seamGap = 1100; // visual "page" height for the paper-seam guide lines
    for(let y = seamGap; y < totalHeight; y += seamGap){
      const seam = document.createElement('div');
      seam.className = 'page-seam';
      seam.style.top = y + 'px';
      wrap.appendChild(seam);
    }
  }

  function isBlankNote(note){
    return !note.title.trim() && !note.body.trim() && !note.drawing && (!note.tags || note.tags.length === 0);
  }
  function closeEditor(note){
    if(isBlankNote(note)){
      notes = notes.filter(n => n.id !== note.id);
      scheduleSave();
    }
    activeId = null; mobileShowingMain = false; folderPickerOpen = false;
    focusMode = false;
    document.getElementById('app').classList.remove('focus-mode');
    renderAll();
  }

  function wirePage(note, mode){
    const backBtn = document.getElementById('backBtn');
    if(backBtn) backBtn.addEventListener('click', () => { closeEditor(note); });
    document.getElementById('closeEditorBtn').addEventListener('click', () => { closeEditor(note); });

    document.getElementById('focusBtn').addEventListener('click', () => {

    document.getElementById('undoBtn').addEventListener('click', doUndo);
    document.getElementById('redoBtn').addEventListener('click', doRedo);

    mainEl.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
      checkpoint(); note.mode = b.dataset.mode; note.updatedAt = Date.now(); commitMutation(); renderAll();
    }));

    const previewBtn = document.getElementById('previewBtn');
    if(previewBtn) previewBtn.addEventListener('click', () => { previewMode = !previewMode; renderPage(note); });

    document.getElementById('favBtn').addEventListener('click', () => {
      checkpoint(); note.pinned = !note.pinned; note.updatedAt = Date.now(); commitMutation(); renderAll();

    const exportBtn = document.getElementById('exportBtn');

    titleInput.addEventListener('focus', () => { checkpoint(); setTimeout(() => titleInput.scrollIntoView({block:'center', behavior:'smooth'}), 300); });

    folderPickerMenu.querySelectorAll('[data-set-folder]').forEach(b => b.addEventListener('click', (e) => {

      commitMutation(); renderAll();

    const tagAddInput = document.getElementById('tagAddInput');
    tagAddInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        const val = tagAddInput.value.trim().replace(/^#/, '');
        if(val){
          checkpoint();
          note.tags = note.tags || [];
          if(!note.tags.includes(val)) note.tags.push(val);
          note.updatedAt = Date.now();
          commitMutation(); renderPage(note);
          setTimeout(() => document.getElementById('tagAddInput')?.focus(), 20);
